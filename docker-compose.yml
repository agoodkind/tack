services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://${YUGABYTE_USER:-yugabyte}:${YUGABYTE_PASSWORD:-yugabyte}@yugabyte:5433/${YUGABYTE_DB:-tack}?sslmode=disable
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-tack-dev-meili-key-change-in-prod}
      PORT: 8000
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /etc/foundationdb:/etc/foundationdb:ro
    depends_on:
      yugabyte:
        condition: service_healthy
      fdb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  yugabyte:
    image: yugabytedb/yugabyte:2.23.1.0-b220
    restart: unless-stopped
    command: >
      bin/yugabyted start
      --daemon=false
      --tserver_flags="ysql_pg_conf_csv=max_connections=100"
    environment:
      YSQL_DB:       ${YUGABYTE_DB:-tack}
      YSQL_USER:     ${YUGABYTE_USER:-yugabyte}
      YSQL_PASSWORD: ${YUGABYTE_PASSWORD:-yugabyte}
    ports:
      - "5433:5433"   # YSQL (Postgres-compatible)
      - "7000:7000"   # YugabyteDB master UI
      - "9000:9000"   # YugabyteDB tserver UI
    volumes:
      - yugabyte-data:/home/yugabyte/var
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${YUGABYTE_PASSWORD:-yugabyte} ysqlsh -h $(hostname -i) -p 5433 -U ${YUGABYTE_USER:-yugabyte} -d ${YUGABYTE_DB:-tack} -c 'SELECT 1' -t"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  fdb:
    image: foundationdb/foundationdb:7.4.6
    restart: unless-stopped
    volumes:
      - fdb-data:/var/fdb
      - /etc/foundationdb:/etc/foundationdb
    healthcheck:
      test: ["CMD-SHELL", "fdbcli --exec 'status minimal' 2>&1 | grep -q 'available'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-tack-dev-meili-key-change-in-prod}
      MEILI_ENV: production
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'available'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yugabyte-data:
  fdb-data:
  meili-data:
