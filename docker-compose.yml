# The yugabyte service uses this image. tack-ops reads the same image tag as
# TACK_BACKUP_YB_IMAGE for backup tools and the restore drill's temporary
# engine. Read the yugabyte service's pin comment before changing the tag.
x-yugabyte-image: &yugabyte_image yugabytedb/yugabyte:2024.2.8.0-b85

# The search client environment of the app service. Compose interpolates
# every variable below except OPENSEARCH_CA from the shell environment or
# from the .env file that the configs deploy renders. A shell variable takes
# precedence over the .env file. A variable that neither source sets is
# empty. An empty value selects the compiled default where one exists. An
# empty OPENSEARCH_ENDPOINT disables the search runtime and search work.
# OPENSEARCH_CA is a fixed path. The app reads that CA file from its
# /etc/tack mount. The app service runs the search operator commands, and
# those commands read FoundationDB.
x-opensearch-environment: &opensearch_environment
  OPENSEARCH_ENDPOINT: ${OPENSEARCH_ENDPOINT:-}
  OPENSEARCH_CA: /etc/tack/search-ca.crt
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
  OPENSEARCH_PASSWORD_FILE: /run/secrets/OPENSEARCH_PASSWORD
  OPENSEARCH_REQUEST_TIMEOUT: ${OPENSEARCH_REQUEST_TIMEOUT:-}
  OPENSEARCH_MAX_RETRIES: ${OPENSEARCH_MAX_RETRIES:-}
  OPENSEARCH_PUBLIC_ENABLED: ${OPENSEARCH_PUBLIC_ENABLED:-}
  OPENSEARCH_MODEL_REPAIR_ENABLED: ${OPENSEARCH_MODEL_REPAIR_ENABLED:-}
  OPENSEARCH_CURSOR_KEY_FILE: /run/secrets/OPENSEARCH_CURSOR_KEY
  OPENSEARCH_SHARDS: ${OPENSEARCH_SHARDS:-}
  OPENSEARCH_ROUTING_SHARDS: ${OPENSEARCH_ROUTING_SHARDS:-}
  OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-}
  OPENSEARCH_QUERY_MAX_BYTES: ${OPENSEARCH_QUERY_MAX_BYTES:-}
  OPENSEARCH_RESPONSE_MAX_BYTES: ${OPENSEARCH_RESPONSE_MAX_BYTES:-}
  OPENSEARCH_SESSION_TOKEN_MAX_BYTES: ${OPENSEARCH_SESSION_TOKEN_MAX_BYTES:-}
  OPENSEARCH_QUERY_BATCH_SIZE: ${OPENSEARCH_QUERY_BATCH_SIZE:-}
  OPENSEARCH_QUERY_MAX_BATCHES: ${OPENSEARCH_QUERY_MAX_BATCHES:-}
  OPENSEARCH_QUERY_MAX_RESULTS: ${OPENSEARCH_QUERY_MAX_RESULTS:-}
  OPENSEARCH_SESSION_IDLE_TIMEOUT: ${OPENSEARCH_SESSION_IDLE_TIMEOUT:-}
  OPENSEARCH_SESSION_ABSOLUTE_TIMEOUT: ${OPENSEARCH_SESSION_ABSOLUTE_TIMEOUT:-}
  OPENSEARCH_QUERY_DEADLINE: ${OPENSEARCH_QUERY_DEADLINE:-}
  OPENSEARCH_QUERY_CONCURRENCY: ${OPENSEARCH_QUERY_CONCURRENCY:-}
  OPENSEARCH_QUERY_ADMISSION_WAIT: ${OPENSEARCH_QUERY_ADMISSION_WAIT:-}
  OPENSEARCH_PAGE_BYTES: ${OPENSEARCH_PAGE_BYTES:-}
  OPENSEARCH_WORKER_MAX_PAGES: ${OPENSEARCH_WORKER_MAX_PAGES:-}
  OPENSEARCH_WORKER_MAX_BYTES: ${OPENSEARCH_WORKER_MAX_BYTES:-}
  OPENSEARCH_WORKER_SLICE_BUDGET: ${OPENSEARCH_WORKER_SLICE_BUDGET:-}
  OPENSEARCH_WORKER_OPERATION_TIMEOUT: ${OPENSEARCH_WORKER_OPERATION_TIMEOUT:-}
  OPENSEARCH_WORKER_LEASE: ${OPENSEARCH_WORKER_LEASE:-}
  OPENSEARCH_WORKER_IDLE_INTERVAL: ${OPENSEARCH_WORKER_IDLE_INTERVAL:-}
  OPENSEARCH_WORKER_CONCURRENCY: ${OPENSEARCH_WORKER_CONCURRENCY:-}
  OPENSEARCH_WORK_CLASS_WEIGHTS: ${OPENSEARCH_WORK_CLASS_WEIGHTS:-}
  OPENSEARCH_MAX_RETIRED_PAGES: ${OPENSEARCH_MAX_RETIRED_PAGES:-}
  OPENSEARCH_MAX_RETIREMENT_AGE: ${OPENSEARCH_MAX_RETIREMENT_AGE:-}
  OPENSEARCH_MAX_INDEX_BYTES: ${OPENSEARCH_MAX_INDEX_BYTES:-}
  OPENSEARCH_RETENTION_CHECK_INTERVAL: ${OPENSEARCH_RETENTION_CHECK_INTERVAL:-}

services:
  app:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT: ${TACK_COMMIT:-unknown}
        BUILD_TIME: ${TACK_BUILD_TIME:-unknown}
        TAG: ${TACK_TAG:-dev}
        DIRTY: ${TACK_DIRTY:-false}
    # Every audited command requires an identity. serve also requires --execute.
    # The app uses service identity tack-app, not a human operator (TACK-444).
    command: ["serve", "--execute", "--operator-service", "tack-app"]
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${PORT:-8000}:8000"
    environment:
      <<: *opensearch_environment
      # `ops audit seed-roles` creates the non-superuser tack_app login from
      # TACK_APP_PASSWORD with access only to the three auth tables (TACK-180).
      # tack-ops normally connects as tack_migrator. Only a from-empty rebuild
      # uses the engine superuser.
      DATABASE_URL_FILE: /run/secrets/DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/AUDIT_OPERATOR_DSN
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      # A transaction issued while the store elects a new leader retries
      # without end, bounded only by the caller's context, which not every
      # caller sets. This value bounds it, retries included (TACK-408).
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      PORT: 8000
      # ENV selects the auth mode: development accepts a raw user UUID without
      # a token lookup; production requires an API token. Compose requires
      # an explicit ENV value in .env (TACK-261).
      ENV: ${ENV:?ENV is required, set it in .env}
      # Development defaults enable debug logging and retain every rotated log.
      # Append-only logs support incident investigation.
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      GKLOG_LOG_ENABLED:
      GKLOG_LOG_LEVEL:
      GKLOG_TRACE_ENABLED:
      GKLOG_TRACE_SAMPLE_RATIO:
      GKLOG_CPU_PROFILE_ENABLED:
      GKLOG_METRIC_EXPORT_ENABLED:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:
      OTEL_RESOURCE_ATTRIBUTES:
      PYROSCOPE_SERVER_ADDRESS:
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-0}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-0}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-100}
      # The /var/log/tack volume preserves these container paths across restarts.
      LOG_JSON_FILE: ${LOG_JSON_FILE:-/var/log/tack/app.jsonl}
      LOG_TEXT_FILE: ${LOG_TEXT_FILE:-/var/log/tack/app.log}
      LOG_COMMAND_DIR: ${LOG_COMMAND_DIR:-/var/log/tack/commands}
      # The configs deploy renders accepted audit signer identifiers per
      # environment (TACK-437). `audit signers` requires this set. `audit verify`
      # rejects manifests signed outside it and reports an unjudged signer
      # when the set is empty.
      AUDIT_VALID_SIGNERS: ${AUDIT_VALID_SIGNERS:-}
      # When AUDIT_KAFKA_BROKERS is set, Record publishes to Kafka and the
      # audit-consumer becomes the only writer of audit.events. An empty value
      # selects the synchronous Yugabyte recorder.
      AUDIT_KAFKA_BROKERS: ${AUDIT_KAFKA_BROKERS:-}
      AUDIT_KAFKA_TOPIC: ${AUDIT_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_KAFKA_CLIENT_ID: ${AUDIT_KAFKA_CLIENT_ID:-tack-audit-producer}
      # This timeout matches the application default. After a hard broker loss,
      # lease expiry takes up to 9s and client metadata refresh takes up to 5s.
      # A smaller budget can expire before delivery completes.
      AUDIT_KAFKA_PRODUCE_TIMEOUT: ${AUDIT_KAFKA_PRODUCE_TIMEOUT:-15s}
      # `ops qa datagen` permits writes only when this marker is qa or local.
      # tack-qa sets it; production leaves it empty. The app service provides
      # the generator's FoundationDB connection and audit DSNs, which the
      # host-networked tack-ops container lacks.
      TACK_DATAGEN_ALLOW_TARGET: ${TACK_DATAGEN_ALLOW_TARGET:-}
      # TACK_REPAIR_DIR sets the repair directory that the volume below mounts.
      # The repair command refuses request, manifest, and export file paths
      # outside this directory.
      TACK_REPAIR_DIR: /var/lib/tack/repair
    secrets:
      - DATABASE_URL
      - AUDIT_OPERATOR_DSN
      - OPENSEARCH_PASSWORD
      - OPENSEARCH_CURSOR_KEY
    volumes:
      # The FoundationDB client must write coordinator changes to this file.
      # A read-only mount prevents updates, and the client cannot find the
      # cluster after all original coordinators stop serving it (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      - tack-logs:/var/log/tack
      # The repair command reads requests and manifests from this host
      # directory and writes deletion exports into it. The exports remain on
      # the host after docker compose run --rm app removes the container.
      # Docker creates the host directory on the first start if it does not
      # exist.
      - /var/lib/tack/repair:/var/lib/tack/repair
    # The app does not depend on the local yugabyte service. Deployed guests
    # connect to the ledger on data guests using the rendered override's
    # multi-host URL. The deploy starts the app after provision. Locally the
    # app connects to the single node and restarts until it accepts connections.
    #
    # The app does not depend on the local fdb service either. Deployed guests
    # connect to data guests using the cluster file's coordinator list. The
    # owner guest does not run a store after phase 4; a dependency would start
    # one (TACK-408). Locally the app restarts until the store answers.

  yugabyte:
    # Pinned to 2024.2.8.0-b85 to match the running production engine. The audit
    # Kafka cutover must change only the audit pipeline, not the database engine:
    # a deploy that bumped this image would perform an untested in-place
    # major-version upgrade of the auth+audit database (TACK-330). The deliberate
    # 2024.2.8.0 -> 2025.2.3.0 upgrade is the separate, QA-validated TACK-329.
    #
    # Use a permanent name as the engine identity, not a container address.
    # The engine persists that identity in its catalog. Container address
    # changes invalidate persisted addresses and prevent the engine from
    # serving intact disk data. This caused a previous incident.
    #
    # The deploy renders docker-compose.override.yml; Compose merges it
    # automatically. The override replaces hostname with the guest's node
    # name and maps peer names to pinned guest addresses with extra_hosts.
    # Peers connect on the published node ports. Compose replaces the complete
    # command list. Change only the advertise and listen name; preserve the
    # flagfile argument verbatim. Omitting it makes the tserver size its own
    # resources (the 2026-08-05 S0). yugabyted requires matching listen and
    # advertised addresses. hostname must resolve the node's name to an
    # address the container can bind.
    #
    # The :ro bind-mount patches yugabyted's is_port_available. The upstream
    # implementation through 2025.2.3.0 creates an AF_INET socket for a
    # non-literal-v6 advertise_address and raises gaierror on this v6-only
    # bridge before binding. yugabyte-overlay/yugabyted applies the AF_UNSPEC
    # getaddrinfo iteration fix from upstream PR #23158.
    # Follow AGENTS.md "YugabyteDB on the IPv6-only bridge" when refreshing
    # the overlay for an image bump. x-yugabyte-image defines the tag.
    image: *yugabyte_image
    entrypoint: ["/sbin/tini", "--", "/usr/bin/env", "bash", "/opt/tack/yugabyte-entrypoint.sh"]
    restart: unless-stopped
    mem_limit: 10g
    # hostname resolves the announced node name to this container's address.
    # The deploy replaces this development value with the guest's node name.
    hostname: yugabyte
    # --base_dir selects the persistent volume below. Without it, yugabyted
    # uses ~/var in the container overlay, and recreating the container deletes
    # that data (2026-04-28 incident).
    # flagfile passes tserver resource limits from yugabyte-overlay/tserver.flags
    # to the tserver, one flag per line.
    command:
      - /home/yugabyte/bin/yugabyted
      - start
      - --daemon=false
      - --base_dir=/home/yugabyte/var
      - --advertise_address=yugabyte
      - --listen=yugabyte
      - --tserver_flags=flagfile=/home/yugabyte/tserver.flags
    environment:
      YSQL_DB: ${YUGABYTE_DB:?YUGABYTE_DB is required, set it in .env}
      # yugabyted reads the superuser name and password only on the first
      # start of an empty data directory. The deploy passes them for that
      # start from the vault and renders neither into .env (TACK-554). A
      # first start with an empty password creates the superuser with the
      # engine's default password. On that first start the health check
      # below logs in with the password, which yugabyted sets after the
      # database accepts connections.
      YSQL_USER: ${YUGABYTE_USER:-}
      YSQL_PASSWORD_FILE: /run/secrets/YUGABYTE_PASSWORD
    secrets:
      - YUGABYTE_PASSWORD
    ports:
      - "5433:5433" # YSQL (Postgres-compatible)
      - "7000:7000" # YugabyteDB master UI
      - "9000:9000" # YugabyteDB tserver UI
      # Peer nodes connect on these ports at the guest's pinned address.
      - "7100:7100" # master peer traffic
      - "9100:9100" # tserver peer traffic
    volumes:
      - yugabyte-data:/home/yugabyte/var
      # Overlay patched yugabyted (upstream PR #23158). See header comment.
      - /root/tack/yugabyte-overlay/yugabyted:/home/yugabyte/bin/yugabyted:ro
      # Tserver resource bounds, one flag per line with the incident notes.
      - /root/tack/yugabyte-overlay/tserver.flags:/home/yugabyte/tserver.flags:ro
      - ./yugabyte-overlay/entrypoint.sh:/opt/tack/yugabyte-entrypoint.sh:ro
      - ./yugabyte-overlay/healthcheck.sh:/opt/tack/yugabyte-healthcheck.sh:ro
      - ./yugabyte-overlay/secret.sh:/opt/tack/yugabyte-secret.sh:ro
      - ./yugabyte-overlay/healthcheck.sql:/opt/tack/yugabyte-healthcheck.sql:ro
    healthcheck:
      test: ["CMD", "/usr/bin/env", "bash", "/opt/tack/yugabyte-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      # The deploy waits for tablet bootstrap progress, not this informational
      # status (TACK-488). The engine cannot stop gracefully. Every restart
      # replays each tablet's open log segments before accepting SQL connections.
      # This start period covers replay on a small node. A full node takes
      # longer and reports unhealthy until replay ends and the next check passes.
      start_period: 180s

  fdb:
    # Tack's Makefile FDB_VERSION variable sets the engine version; the
    # Dockerfile build args and go.mod bindings pin must match it.
    # Bump all three together via make update-fdb VERSION=...
    image: foundationdb/foundationdb:${FDB_VERSION:-7.4.6}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      FDB_NETWORKING_MODE: container
      FDB_PORT: "4500"
      FDB_PROCESS_CLASS: unset
      # The server and every client on this guest share one cluster file.
      # The image's default /var/fdb/fdb.cluster is a separate file that
      # clients do not read. Clients could not read coordinator changes
      # the server wrote there (TACK-408).
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      # The deploy renders this guest's cluster identity from the inventory.
      # Peers and clients on other guests connect to its pinned address,
      # which remains valid after container recreation. FDB_ZONE_ID uses the
      # guest name as the zone identifier for the replication fault domain.
      # Empty local values announce the container's own address and hostname
      # during `docker compose up`.
      FDB_PUBLIC_ADDRESS: ${FDB_PUBLIC_ADDRESS:-}
      FDB_ZONE_ID: ${FDB_ZONE_ID:-}
      FDB_MACHINE_ID: ${FDB_MACHINE_ID:-}
      # The coordinator list a guest's first process starts from. The deploy
      # renders the environment's three coordinators; a guest that already has
      # a cluster file ignores this, because the cluster owns that file once it
      # exists. Empty locally, where the process is its own coordinator.
      FDB_CLUSTER_FILE_CONTENTS: ${FDB_CLUSTER_FILE_CONTENTS:-}
    volumes:
      - fdb-data:/var/fdb
      - /etc/foundationdb:/etc/foundationdb
      # Patched fdb.bash with IPv6 bracket handling. See fdb-overlay/fdb.bash.
      - /root/tack/fdb-overlay/fdb.bash:/var/fdb/scripts/fdb.bash:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "fdbcli -C /etc/foundationdb/fdb.cluster --exec 'status minimal' 2>&1 | grep -q 'available'",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # backup_agent writes continuous FoundationDB backups to the object store.
  # `ops provision` starts the fdbbackup session when TACK_BACKUP_FDB_CONTINUOUS
  # is true. `ops backup fdb-continuous-init` starts it outside provisioning.
  # Both commands preserve an existing session. This agent processes the
  # session's snapshots. The deploy enables the backup profile; a plain
  # `docker compose up` without that profile does not start this service.
  # fdbbackup cannot resolve IPv6 literals. It connects to the blobstore using
  # fdb-blobstore-host, mapped to TACK_BACKUP_S3_HOST. configs renders this bare
  # object-store address alongside TACK_BACKUP_S3_ENDPOINT.
  #
  # One agent runs per data guest. Agents divide the session's work, and the
  # session continues while any agent runs (TACK-408). Agent count controls
  # throughput and fault tolerance; the session does not record it.
  # The service does not depend on local fdb: it retries connections, and a
  # dependency would start a store on the owner guest, which does not run one.
  fdb-backup-agent:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.4.6}
    profiles: [backup]
    restart: unless-stopped
    mem_limit: 512m
    entrypoint: ["/usr/bin/backup_agent"]
    command: ["-C", "/etc/foundationdb/fdb.cluster"]
    extra_hosts:
      - "fdb-blobstore-host:${TACK_BACKUP_S3_HOST}"
    volumes:
      # The agent's FoundationDB client library must write coordinator changes
      # to this file, just as the app's client does.
      - /etc/foundationdb:/etc/foundationdb

  # OpenSearch runs one member per search guest. Every member uses the
  # cluster_manager, data, ingest, and ml roles. Additional members can join
  # without Tack changes. Compose starts this service only with the search
  # profile, which the deploy enables only on search guests.
  #
  # Compose interpolates node.name and the three discovery settings from the
  # TACK_SEARCH_* values in the shell environment or the rendered .env file.
  # A shell variable takes precedence over the .env file. The other values in this
  # service are literals, and the rendered override on a search guest can
  # replace them. QA sets TACK_SEARCH_DISCOVERY_TYPE to single-node.
  # Production sets TACK_SEARCH_SEED_HOSTS from the member list, and sets
  # TACK_SEARCH_INITIAL_CLUSTER_MANAGER_NODES only for the first formation of
  # tack-search1. The image entrypoint passes each non-empty dotted variable as
  # a setting, and an empty one leaves that setting unset. The rendered
  # override also configures TLS, credentials, and the address a member
  # announces to its peers.
  #
  # The search guests do not have an IPv4 route. java.net.preferIPv6Addresses
  # selects IPv6 for dual-stack hosts, including the host ML Commons uses to
  # download the pinned model.
  #
  # The ML Commons memory breaker rejects predictions when used heap is at or
  # above 85 percent.
  opensearch:
    image: opensearchproject/opensearch:3.10.1
    profiles: [search]
    restart: unless-stopped
    # Measurements do not establish the stop duration under indexing load.
    stop_grace_period: 2m
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms3g -Xmx3g -XX:G1PeriodicGCInterval=5000 -Djava.net.preferIPv6Addresses=true
      node.roles: cluster_manager,data,ingest,ml
      node.name: ${TACK_SEARCH_NODE_NAME:-}
      discovery.type: ${TACK_SEARCH_DISCOVERY_TYPE:-}
      discovery.seed_hosts: ${TACK_SEARCH_SEED_HOSTS:-}
      cluster.initial_cluster_manager_nodes: ${TACK_SEARCH_INITIAL_CLUSTER_MANAGER_NODES:-}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Apache Kafka 4.x in KRaft combined broker+controller role. The audit
  # cutover uses this as the broker for the audit.events.v1 topic that the
  # producer publishes to and the audit-consumer projects into audit.events.
  #
  # The cluster ID is pinned to a value generated once on the host with:
  #
  #   docker run --rm apache/kafka:4.2.0 \
  #     /opt/kafka/bin/kafka-storage.sh random-uuid
  #
  # Set KAFKA_CLUSTER_ID in .env to this result. A new ID on recreation creates
  # new metadata that cannot reference the existing logs.
  # Kafka does not expose an external port; traffic uses the IPv6 bridge.
  kafka:
    image: apache/kafka:4.2.0
    profiles: [audit]
    restart: unless-stopped
    mem_limit: 2g
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://[::]:9092,CONTROLLER://[::]:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "256"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      # The empty default permits Compose to parse the configuration without KAFKA_CLUSTER_ID.
      # Set KAFKA_CLUSTER_ID in .env to a kafka-storage.sh random-uuid result
      # before enabling the audit profile.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # The audit-consumer uses its own image from Dockerfile.audit-consumer.
  # The image and service both set /usr/local/bin/audit-consumer as the
  # entrypoint. The service mounts the signing key for the embedded notarizer.
  audit-consumer:
    image: ghcr.io/agoodkind/tack-audit-consumer:${TACK_IMAGE_TAG:-latest}
    profiles: [audit]
    build:
      context: .
      dockerfile: Dockerfile.audit-consumer
      args:
        COMMIT: ${TACK_COMMIT:-unknown}
        BUILD_TIME: ${TACK_BUILD_TIME:-unknown}
        TAG: ${TACK_TAG:-dev}
        DIRTY: ${TACK_DIRTY:-false}
    restart: unless-stopped
    mem_limit: 1g
    entrypoint: ["/usr/local/bin/audit-consumer"]
    environment:
      AUDIT_CONSUMER_KAFKA_BROKERS: ${AUDIT_CONSUMER_KAFKA_BROKERS:-kafka:9092}
      AUDIT_CONSUMER_KAFKA_TOPIC: ${AUDIT_CONSUMER_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_CONSUMER_GROUP_ID: ${AUDIT_CONSUMER_GROUP_ID:-tack-audit-projector}
      AUDIT_CONSUMER_BATCH_SIZE: ${AUDIT_CONSUMER_BATCH_SIZE:-256}
      AUDIT_CONSUMER_POLL_INTERVAL: ${AUDIT_CONSUMER_POLL_INTERVAL:-250ms}
      AUDIT_CONSUMER_YUGABYTE_DSN_FILE: /run/secrets/AUDIT_CONSUMER_YUGABYTE_DSN
      AUDIT_CONSUMER_SIGNING_KEY_PATH: ${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}
      # Each notarization records the signing guest as its claimed origin
      # (TACK-437). The configs deploy renders the guest's inventory name;
      # an empty value selects the container hostname.
      AUDIT_CONSUMER_SIGNING_HOST: ${AUDIT_CONSUMER_SIGNING_HOST:-}
      # Set this to enable the FoundationDB operator relay. An unreadable
      # configured cluster file prevents consumer startup and stops both the
      # FoundationDB and YugabyteDB relays. Leave it unset on hosts without
      # that mount to run only the YugabyteDB relay.
      FDB_CLUSTER_FILE: ${AUDIT_CONSUMER_FDB_CLUSTER_FILE:-}
      # The consumer requires ENV just as the app does and includes it in every
      # log line (TACK-263).
      ENV: ${ENV:?ENV is required, set it in .env}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_JSON_FILE: /var/log/tack/audit-consumer.jsonl
      LOG_TEXT_FILE: /var/log/tack/audit-consumer.log
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-0}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-0}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-100}
    secrets:
      - AUDIT_CONSUMER_YUGABYTE_DSN
    volumes:
      - tack-logs:/var/log/tack
      - ${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}:${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}:ro
      # Writable: this process is a FoundationDB client too, and the client
      # library records a coordinator change in this file (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
    # The consumer does not depend on local yugabyte. Deployed guests connect
    # to ledger data guests using the rendered multi-host DSN. The startup
    # ping retries until the ledger answers, regardless of service start order.
    depends_on:
      kafka:
        condition: service_started

  # Short-lived operator-invoked container for backup, verify, and
  # restore-test operations. The profiles: [ops] tag keeps it out of the
  # default docker compose up; invoke via:
  #   docker compose run --rm tack-ops ops backup [subcommand] [args]
  tack-ops:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    profiles: [ops]
    mem_limit: 512m
    entrypoint: ["/server"]
    network_mode: host
    environment:
      # tack-ops uses host networking to connect to services over loopback.
      # Set DATABASE_URL in the host .env to a full DSN for 127.0.0.1:5433.
      # The app's DSN targets yugabyte and cannot serve this container.
      <<: *opensearch_environment
      OPENSEARCH_MAINTENANCE_USERNAME: ${OPENSEARCH_MAINTENANCE_USERNAME:-}
      OPENSEARCH_MAINTENANCE_PASSWORD_FILE: /run/secrets/OPENSEARCH_MAINTENANCE_PASSWORD
      DATABASE_URL_FILE: /run/secrets/TACK_OPS_DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_OPERATOR_DSN
      # The mounted secrets supply loopback DSNs for ledger reads and
      # redactions by the `audit query`, `audit get`, `audit export`, and
      # `audit redact-actor` host commands.
      AUDIT_READER_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_READER_DSN
      AUDIT_REDACTOR_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_REDACTOR_DSN
      # `audit verify` checks bundle signers against the same accepted signer
      # set as the app (TACK-437). Run `audit signers` in the app service;
      # tack-ops does not mount a signing key.
      AUDIT_VALID_SIGNERS: ${AUDIT_VALID_SIGNERS:-}
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      # `ops provision` uses this redundancy mode when configuring a new store.
      # Local and single-guest environments use single. Environments with one
      # process per data guest render double to restore the previous replication
      # level after a rebuild (TACK-408).
      TACK_OPS_FDB_REDUNDANCY_MODE: ${TACK_OPS_FDB_REDUNDANCY_MODE:-single}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Require the same ENV as the app. A production default here would ignore
      # a host's development setting and select inconsistent auth modes
      # within the stack (TACK-261).
      ENV: ${ENV:?ENV is required, set it in .env}
      # The database that the backup dumps read. The dumps connect as
      # tack_migrator with TACK_MIGRATOR_PASSWORD below.
      YUGABYTE_DB: ${YUGABYTE_DB:?YUGABYTE_DB is required, set it in .env}
      # `ops audit seed-roles` creates or rotates LOGIN audit roles and requires
      # these passwords. Empty defaults permit unrelated commands, such as
      # backup, to run without them.
      AUDIT_WRITER_PASSWORD_FILE: /run/secrets/AUDIT_WRITER_PASSWORD
      AUDIT_READER_PASSWORD_FILE: /run/secrets/AUDIT_READER_PASSWORD
      AUDIT_REDACTOR_PASSWORD_FILE: /run/secrets/AUDIT_REDACTOR_PASSWORD
      AUDIT_OPERATOR_PASSWORD_FILE: /run/secrets/AUDIT_OPERATOR_PASSWORD
      # The application login's password, set by the same seed-roles run
      # (TACK-180); the app service reads it inside its DATABASE_URL.
      TACK_APP_PASSWORD_FILE: /run/secrets/TACK_APP_PASSWORD
      TACK_MIGRATOR_PASSWORD_FILE: /run/secrets/TACK_MIGRATOR_PASSWORD
      # Object store for engine-native continuous backup. Read by the FDB
      # continuous backup path to build the blobstore destination URL.
      TACK_BACKUP_S3_ENDPOINT: ${TACK_BACKUP_S3_ENDPOINT:-}
      TACK_BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/TACK_BACKUP_S3_ACCESS_KEY_ID
      TACK_BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/TACK_BACKUP_S3_SECRET_ACCESS_KEY
      TACK_BACKUP_S3_REGION: ${TACK_BACKUP_S3_REGION:-us-east-1}
      TACK_BACKUP_S3_BUCKET_MAIN: ${TACK_BACKUP_S3_BUCKET_MAIN:-tack-backups}
      # Master quorum for the backup one-shot containers. The deploy renders
      # the value from the ledger topology; the fallback is the dev single
      # node, matching the compiled default.
      TACK_BACKUP_YB_MASTER_ADDRESSES: ${TACK_BACKUP_YB_MASTER_ADDRESSES:-yugabyte:7100}
      # The deploy maps ledger node names to guest addresses (TACK-460).
      # SQL dumpers use the certificate's node name for encrypted connections.
      # Unencrypted deployments leave this empty.
      TACK_LEDGER_NODE_HOSTS: ${TACK_LEDGER_NODE_HOSTS:-}
      # Backup tools (yb-admin, ysql_dump, ysql_dumpall) and the restore drill's
      # temporary engine use the yugabyte service's image. The binary must not
      # default this value: a 2025.2 default failed schema restoration against
      # the 2024.2 cluster.
      TACK_BACKUP_YB_IMAGE: *yugabyte_image
      # Snapshot-export commands require these paths and fail when they are
      # unset. Do not default them to another archive or restore location.
      TACK_BACKUP_YB_ROCKSDB_DIR: ${TACK_BACKUP_YB_ROCKSDB_DIR:-}
      TACK_BACKUP_YB_OVERLAY_PATH: ${TACK_BACKUP_YB_OVERLAY_PATH:-}
      # The first staleness-check run that detects an expired threshold emails
      # a plain explanation of the fault. An empty recipient disables mail
      # locally; the deploy renders the recipient address.
      TACK_BACKUP_ALARM_EMAIL: ${TACK_BACKUP_ALARM_EMAIL:-}
      TACK_BACKUP_ALARM_MSMTPRC: ${TACK_BACKUP_ALARM_MSMTPRC:-/etc/msmtprc}
      # Deputy staleness alarm (TACK-481): the primary checker's service name,
      # the window its run must appear in, and the in-run grace before the
      # deputy takes over. An empty service means this checker is the primary.
      # Without this pass-through a data guest's check ran as a primary and
      # mailed a second time for the same fault.
      TACK_BACKUP_ALARM_PRIMARY_SERVICE: ${TACK_BACKUP_ALARM_PRIMARY_SERVICE:-}
      TACK_BACKUP_ALARM_PRIMARY_WINDOW_SECONDS: ${TACK_BACKUP_ALARM_PRIMARY_WINDOW_SECONDS:-1500}
      TACK_BACKUP_ALARM_PRIMARY_GRACE_SECONDS: ${TACK_BACKUP_ALARM_PRIMARY_GRACE_SECONDS:-90}
      # Forward the host's continuous-backup setting. Without it, the compiled
      # false default prevents `ops provision` from starting continuous backups
      # and skips FDB restore and staleness checks even when the host .env
      # enables them. The deploy installs the
      # patched fdb.bash overlay; the drill mounts it in its temporary cluster.
      # The overlay path must not default: an unset path must fail the drill,
      # not mount an unrelated file.
      TACK_BACKUP_FDB_CONTINUOUS: ${TACK_BACKUP_FDB_CONTINUOUS:-false}
      TACK_BACKUP_FDB_OVERLAY_PATH: ${TACK_BACKUP_FDB_OVERLAY_PATH:-}
      # Ledger DSNs specify sslmode and the certificate authority path
      # (TACK-460). Backup and snapshot commands pass these settings to the
      # engine administration tool in one-shot containers. The tool requires
      # its certificate directory flag to connect to an encrypted cluster.
      TACK_LEDGER_TLS_ENABLED: ${TACK_LEDGER_TLS_ENABLED:-false}
      TACK_LEDGER_CERTS_DIR: ${TACK_LEDGER_CERTS_DIR:-}
      # `ops deploy verify` checks running containers against this image tag.
      TACK_IMAGE_TAG: ${TACK_IMAGE_TAG:-latest}
    secrets:
      - TACK_OPS_DATABASE_URL
      - TACK_LEDGER_SUPERUSER_DATABASE_URL
      - TACK_OPS_AUDIT_OPERATOR_DSN
      - TACK_OPS_AUDIT_READER_DSN
      - TACK_OPS_AUDIT_REDACTOR_DSN
      - AUDIT_WRITER_PASSWORD
      - AUDIT_READER_PASSWORD
      - AUDIT_REDACTOR_PASSWORD
      - AUDIT_OPERATOR_PASSWORD
      - TACK_APP_PASSWORD
      - TACK_MIGRATOR_PASSWORD
      - TACK_BACKUP_S3_ACCESS_KEY_ID
      - TACK_BACKUP_S3_SECRET_ACCESS_KEY
      - OPENSEARCH_PASSWORD
      - OPENSEARCH_CURSOR_KEY
      - OPENSEARCH_MAINTENANCE_PASSWORD
    volumes:
      - /root/backups:/root/backups
      # Writable: the ops commands that open the product store are
      # FoundationDB clients, and the client library records a coordinator
      # change in this file (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      # The staleness alarm reads this SMTP account file and sends SMTP itself.
      # The image does not include or execute msmtp.
      - /etc/msmtprc:/etc/msmtprc:ro
      # Mount only the ledger's certificate directory for DSNs and one-shot
      # containers, not all of /etc/tack. The adjacent audit signing key must
      # remain unavailable to this container.
      - ${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:ro
      # The backup binary uses the Docker socket to manage temporary containers
      # on the local daemon. This exception applies only to short-lived
      # tack-ops; do not add it to the long-running app service.
      - /var/run/docker.sock:/var/run/docker.sock

  # This short-lived operator container runs audit queue commands
  # (`ops audit consumer-offsets`, `ops audit dlq inspect`, `ops audit dlq
  # replay`). They require both the ledger reader and Kafka broker. tack-ops
  # cannot resolve the broker on host networking; the app does not mount a
  # ledger reader login. This service provides both on the bridge (TACK-610).
  # Invoke via:
  #   docker compose run --rm audit-ops ops audit [subcommand] [args]
  audit-ops:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    profiles: [ops]
    mem_limit: 256m
    entrypoint: ["/server"]
    environment:
      # Every command loads the application login; these commands do not use
      # it to read auth tables.
      DATABASE_URL_FILE: /run/secrets/DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/AUDIT_OPERATOR_DSN
      AUDIT_READER_DSN_FILE: /run/secrets/AUDIT_READER_DSN
      AUDIT_KAFKA_BROKERS: ${AUDIT_KAFKA_BROKERS:-}
      AUDIT_KAFKA_TOPIC: ${AUDIT_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_KAFKA_PRODUCE_TIMEOUT: ${AUDIT_KAFKA_PRODUCE_TIMEOUT:-15s}
      # consumer-offsets also counts the FoundationDB operator outbox.
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      ENV: ${ENV:?ENV is required, set it in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - DATABASE_URL
      - AUDIT_OPERATOR_DSN
      - AUDIT_READER_DSN
    volumes:
      # Writable for the same coordinator-change reason as tack-ops (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      - ${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:ro

secrets:
  DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/DATABASE_URL
  AUDIT_WRITER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_WRITER_DSN
  AUDIT_OPERATOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_OPERATOR_DSN
  AUDIT_READER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_READER_DSN
  AUDIT_CONSUMER_YUGABYTE_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_CONSUMER_YUGABYTE_DSN
  TACK_OPS_DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_DATABASE_URL
  TACK_LEDGER_SUPERUSER_DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_LEDGER_SUPERUSER_DATABASE_URL
  TACK_OPS_AUDIT_OPERATOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_OPERATOR_DSN
  TACK_OPS_AUDIT_READER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_READER_DSN
  TACK_OPS_AUDIT_REDACTOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_REDACTOR_DSN
  AUDIT_WRITER_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_WRITER_PASSWORD
  AUDIT_READER_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_READER_PASSWORD
  AUDIT_REDACTOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_REDACTOR_PASSWORD
  AUDIT_OPERATOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_OPERATOR_PASSWORD
  TACK_APP_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_APP_PASSWORD
  TACK_MIGRATOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_MIGRATOR_PASSWORD
  YUGABYTE_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/YUGABYTE_PASSWORD
  TACK_BACKUP_S3_ACCESS_KEY_ID:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_BACKUP_S3_ACCESS_KEY_ID
  TACK_BACKUP_S3_SECRET_ACCESS_KEY:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_BACKUP_S3_SECRET_ACCESS_KEY
  OPENSEARCH_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_PASSWORD
  OPENSEARCH_CURSOR_KEY:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_CURSOR_KEY
  OPENSEARCH_MAINTENANCE_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_MAINTENANCE_PASSWORD

volumes:
  yugabyte-data:
  fdb-data:
  tack-logs:
  kafka-data:
  opensearch-data:

# IPv6-only bridge. ndppd proxies NDP on eth0 for the per-host /96 from the
# host's on-link /64. Containers use globally routable IPv6 source addresses
# without masquerading (gateway_mode_v6 is routed). Inter-container DNS returns
# only AAAA records because enable_ipv4 is false. Do not enable dual-stack;
# it violates the IPv6-only requirement. configs renders each host's subnet
# and gateway (tack_docker_v6_subnet / tack_docker_v6_gateway). The production
# prefix defaults permit parsing without a rendered environment.
networks:
  default:
    enable_ipv6: true
    enable_ipv4: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: routed
    ipam:
      config:
        - subnet: ${TACK_DOCKER_V6_SUBNET:-3d06:bad:b01:0:7ac::/96}
          gateway: ${TACK_DOCKER_V6_GATEWAY:-3d06:bad:b01:0:7ac::1}
