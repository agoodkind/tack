# The yugabyte service and TACK_BACKUP_YB_IMAGE use this
# ledger engine image. Backup tools and the restore drill's
# temporary engine must use the cluster's version. Read the
# yugabyte service's version constraints before changing this tag.
x-yugabyte-image: &yugabyte_image yugabytedb/yugabyte:2024.2.8.0-b85

# Compose reads the app's interpolated search settings from the shell
# or .env; shell values take precedence. Configs owns the
# environment file, which the former Ansible deploy rendered. Missing
# values become empty and select compiled defaults where those exist.
# An empty OPENSEARCH_ENDPOINT disables the search runtime and
# scheduled search work. OPENSEARCH_CA, OPENSEARCH_PASSWORD_FILE, and
# OPENSEARCH_CURSOR_KEY_FILE use fixed container paths. The app reads
# the certificate authority (CA) file from its /etc/tack mount. Run
# search operator commands that read FoundationDB through the app service.
x-opensearch-environment: &opensearch_environment
  OPENSEARCH_ENDPOINT: ${OPENSEARCH_ENDPOINT:-}
  OPENSEARCH_CA: /etc/tack/search-ca.crt
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
  OPENSEARCH_PASSWORD_FILE: /run/secrets/OPENSEARCH_PASSWORD
  OPENSEARCH_REQUEST_TIMEOUT: ${OPENSEARCH_REQUEST_TIMEOUT:-}
  OPENSEARCH_MAX_RETRIES: ${OPENSEARCH_MAX_RETRIES:-}
  OPENSEARCH_PUBLIC_ENABLED: ${OPENSEARCH_PUBLIC_ENABLED:-}
  OPENSEARCH_MODEL_REPAIR_ENABLED: ${OPENSEARCH_MODEL_REPAIR_ENABLED:-}
  OPENSEARCH_CURSOR_KEY_FILE: /run/secrets/OPENSEARCH_CURSOR_KEY
  OPENSEARCH_SHARDS: ${OPENSEARCH_SHARDS:-}
  OPENSEARCH_ROUTING_SHARDS: ${OPENSEARCH_ROUTING_SHARDS:-}
  OPENSEARCH_REPLICAS: ${OPENSEARCH_REPLICAS:-}
  OPENSEARCH_QUERY_MAX_BYTES: ${OPENSEARCH_QUERY_MAX_BYTES:-}
  OPENSEARCH_RESPONSE_MAX_BYTES: ${OPENSEARCH_RESPONSE_MAX_BYTES:-}
  OPENSEARCH_SESSION_TOKEN_MAX_BYTES: ${OPENSEARCH_SESSION_TOKEN_MAX_BYTES:-}
  OPENSEARCH_QUERY_BATCH_SIZE: ${OPENSEARCH_QUERY_BATCH_SIZE:-}
  OPENSEARCH_QUERY_MAX_BATCHES: ${OPENSEARCH_QUERY_MAX_BATCHES:-}
  OPENSEARCH_QUERY_MAX_RESULTS: ${OPENSEARCH_QUERY_MAX_RESULTS:-}
  OPENSEARCH_SESSION_IDLE_TIMEOUT: ${OPENSEARCH_SESSION_IDLE_TIMEOUT:-}
  OPENSEARCH_SESSION_ABSOLUTE_TIMEOUT: ${OPENSEARCH_SESSION_ABSOLUTE_TIMEOUT:-}
  OPENSEARCH_QUERY_DEADLINE: ${OPENSEARCH_QUERY_DEADLINE:-}
  OPENSEARCH_QUERY_CONCURRENCY: ${OPENSEARCH_QUERY_CONCURRENCY:-}
  OPENSEARCH_QUERY_ADMISSION_WAIT: ${OPENSEARCH_QUERY_ADMISSION_WAIT:-}
  OPENSEARCH_PAGE_BYTES: ${OPENSEARCH_PAGE_BYTES:-}
  OPENSEARCH_WORKER_MAX_PAGES: ${OPENSEARCH_WORKER_MAX_PAGES:-}
  OPENSEARCH_WORKER_MAX_BYTES: ${OPENSEARCH_WORKER_MAX_BYTES:-}
  OPENSEARCH_WORKER_SLICE_BUDGET: ${OPENSEARCH_WORKER_SLICE_BUDGET:-}
  OPENSEARCH_WORKER_OPERATION_TIMEOUT: ${OPENSEARCH_WORKER_OPERATION_TIMEOUT:-}
  OPENSEARCH_WORKER_LEASE: ${OPENSEARCH_WORKER_LEASE:-}
  OPENSEARCH_WORKER_IDLE_INTERVAL: ${OPENSEARCH_WORKER_IDLE_INTERVAL:-}
  OPENSEARCH_WORKER_CONCURRENCY: ${OPENSEARCH_WORKER_CONCURRENCY:-}
  OPENSEARCH_WORK_CLASS_WEIGHTS: ${OPENSEARCH_WORK_CLASS_WEIGHTS:-}
  OPENSEARCH_MAX_RETIRED_PAGES: ${OPENSEARCH_MAX_RETIRED_PAGES:-}
  OPENSEARCH_MAX_RETIREMENT_AGE: ${OPENSEARCH_MAX_RETIREMENT_AGE:-}
  OPENSEARCH_MAX_INDEX_BYTES: ${OPENSEARCH_MAX_INDEX_BYTES:-}
  OPENSEARCH_RETENTION_CHECK_INTERVAL: ${OPENSEARCH_RETENTION_CHECK_INTERVAL:-}

services:
  app:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT: ${TACK_COMMIT:-unknown}
        BUILD_TIME: ${TACK_BUILD_TIME:-unknown}
        TAG: ${TACK_TAG:-dev}
        DIRTY: ${TACK_DIRTY:-false}
    # The serve command requires audit recording, --execute, and
    # an identity. The app uses the tack-app service identity
    # because a daemon does not act as a human operator (TACK-444).
    command: ["serve", "--execute", "--operator-service", "tack-app"]
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${PORT:-8000}:8000"
    environment:
      <<: *opensearch_environment
      # The ops audit seed-roles command creates the app's non-superuser tack_app
      # login from TACK_APP_PASSWORD (TACK-180). The login can access only the
      # three auth tables. The ops container uses tack_migrator for migrations,
      # seeding, and backups; the engine superuser initializes an empty database.
      DATABASE_URL_FILE: /run/secrets/DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/AUDIT_OPERATOR_DSN
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      # Without a timeout, a transaction can keep retrying during leader election
      # until its caller's context ends. Some callers do not set a deadline (TACK-408).
      # FDB_TRANSACTION_TIMEOUT sets the shared database default, including retries.
      # Operations can replace that default with their own transaction timeout or
      # a timeout based on the remaining context deadline.
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      PORT: 8000
      # The ENV value selects authentication: development accepts a
      # raw user UUID without a token lookup, and production requires
      # an API token. Require an explicit mode. Configs must supply
      # ENV in .env; the former Ansible deploy rendered it (TACK-261).
      ENV: ${ENV:?ENV is required, set it in .env}
      # Development logs include debug events and retain every rotated file
      # indefinitely. Append-only logs support searches after an incident.
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-0}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-0}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-100}
      # The container writes logs to these paths. The
      # log volume preserves files across restarts.
      LOG_JSON_FILE: ${LOG_JSON_FILE:-/var/log/tack/app.jsonl}
      LOG_TEXT_FILE: ${LOG_TEXT_FILE:-/var/log/tack/app.log}
      LOG_COMMAND_DIR: ${LOG_COMMAND_DIR:-/var/log/tack/commands}
      # Configure each environment's accepted audit signing-key identifiers
      # through Configs (TACK-437). The former Ansible deploy rendered this set. The
      # audit signers command refuses an empty set. The audit verify command rejects
      # an unaccepted signer and reports an unjudged signer when the set is empty.
      AUDIT_VALID_SIGNERS: ${AUDIT_VALID_SIGNERS:-}
      # When AUDIT_KAFKA_BROKERS is set, Record publishes to Kafka and
      # audit-consumer alone writes audit.events. An empty value selects
      # synchronous YugabyteDB recording when a writer connection is configured.
      AUDIT_KAFKA_BROKERS: ${AUDIT_KAFKA_BROKERS:-}
      AUDIT_KAFKA_TOPIC: ${AUDIT_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_KAFKA_CLIENT_ID: ${AUDIT_KAFKA_CLIENT_ID:-tack-audit-producer}
      # The timeout matches the application default. A hard broker failure can
      # require up to 9 seconds for lease expiry and 5 seconds for metadata
      # refresh. A shorter timeout can reject a delivery that would otherwise succeed.
      AUDIT_KAFKA_PRODUCE_TIMEOUT: ${AUDIT_KAFKA_PRODUCE_TIMEOUT:-15s}
      # Only ops qa datagen reads this write permission. It
      # requires exactly qa or local. Set it on tack-qa and leave
      # it empty on production. The generator uses the app service
      # to connect to FoundationDB and the audit databases; the
      # host-networked tack-ops container lacks those connections.
      TACK_DATAGEN_ALLOW_TARGET: ${TACK_DATAGEN_ALLOW_TARGET:-}
      # TACK_REPAIR_DIR sets the repair directory that the volume below mounts.
      # The repair command refuses request, manifest, and export file paths
      # outside this directory.
      TACK_REPAIR_DIR: /var/lib/tack/repair
    secrets:
      - DATABASE_URL
      - AUDIT_OPERATOR_DSN
      - OPENSEARCH_PASSWORD
      - OPENSEARCH_CURSOR_KEY
    volumes:
      # Allow writes because the FoundationDB client updates this
      # cluster file after coordinator changes. A read-only mount leaves
      # the client with its initial coordinator list. The client cannot
      # find the cluster after all those coordinators disappear (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      - tack-logs:/var/log/tack
      # The repair command reads requests and manifests from this host
      # directory and writes deletion exports into it. The exports remain on
      # the host after docker compose run --rm app removes the container.
      # Docker creates the host directory on the first start if it does not
      # exist.
      - /var/lib/tack/repair:/var/lib/tack/repair
    # The app does not depend on yugabyte. Configure deployed guests
    # with the data guests' multi-host URL through a Configs override.
    # The former Ansible deploy started the app after provisioning. This
    # base file uses the local node, and the app retries by restarting.
    #
    # The app does not depend on fdb either. Deployed guests use
    # the data guests' coordinators from the cluster file. After
    # phase 4, the owner guest does not run a store process; a
    # dependency would start one (TACK-408). Locally, the app
    # restarts until the store answers, as it does for the ledger.

  yugabyte:
    # The 2024.2.8.0-b85 pin matched the recorded production engine. The
    # Kafka audit cutover must change only audit processing (TACK-330).
    # Changing this pin during that cutover would attempt an untested
    # in-place major upgrade of the auth and audit database. TACK-329
    # tracks the separate, QA-validated 2024.2.8.0 -> 2025.2.3.0 upgrade.
    #
    # Use a permanent node name as the database identity. The
    # engine stores that identity in its catalog. A container
    # address can change and leave a stored address invalid;
    # the engine then cannot serve intact disk records. A
    # previous incident involved container addresses in that catalog.
    #
    # The former Ansible deploy rendered docker-compose.override.yml
    # beside this file. Compose merges that file automatically.
    # Configure hostname as the guest's node name and map peer names
    # to pinned guest addresses with extra_hosts. Peers connect at
    # published node ports. Compose replaces the whole command list.
    # Change only the advertise and listen names, and preserve the
    # flagfile argument exactly. Omitting it restores automatic tserver
    # sizing, as in the 2026-08-05 S0 incident. The yugabyted command
    # requires matching listen and advertised names. The node's own
    # name must resolve inside its container to an address it can bind;
    # hostname supplies that mapping. Configs must manage the override.
    #
    # The read-only mount patches yugabyted's is_port_available check.
    # The recorded upstream behavior through 2025.2.3.0, including this
    # image, used an AF_INET socket for advertise_address values that
    # were not IPv6 literals. That check raised gaierror on this
    # IPv6-only bridge before startup. Upstream PR #23158 uses AF_UNSPEC
    # address lookup and tries each result. Earlier notes recorded that
    # the PR had remained open since July 2024 without progress. Keep
    # the local overlay until upstream supplies the fix. Refresh the overlay
    # on each image change using [Update the YugabyteDB image](docs/runbooks/deployment/update-yugabyte-image.md).
    # The x-yugabyte-image anchor sets the tag.
    image: *yugabyte_image
    entrypoint: ["/sbin/tini", "--", "/usr/bin/env", "bash", "/opt/tack/yugabyte-entrypoint.sh"]
    restart: unless-stopped
    mem_limit: 10g
    # The container resolves its advertised node name to its own address.
    # Development uses yugabyte. Configure the guest's node name through
    # Configs for deployed containers, as the former Ansible override did.
    hostname: yugabyte
    # The --base_dir option selects the persistent volume.
    # Without it, yugabyted uses ~/var in the container's
    # temporary filesystem, and recreating the container deletes
    # the SQL data; docker compose down caused this in the
    # 2026-04-28 incident. The mounted tserver.flags file sets
    # resource limits. The flagfile argument reads one flag per line.
    command:
      - /home/yugabyte/bin/yugabyted
      - start
      - --daemon=false
      - --base_dir=/home/yugabyte/var
      - --advertise_address=yugabyte
      - --listen=yugabyte
      - --tserver_flags=flagfile=/home/yugabyte/tserver.flags
    environment:
      YSQL_DB: ${YUGABYTE_DB:?YUGABYTE_DB is required, set it in .env}
      # The yugabyted command uses superuser credentials only to
      # initialize an empty data directory. The recorded deploy
      # supplies them from the vault for that start and does not write
      # them to .env (TACK-554). The engine can default an empty initial
      # password, but this service's secret loader rejects an empty
      # password file before startup. The health check logs in with the
      # supplied password, which yugabyted sets after accepting connections.
      YSQL_USER: ${YUGABYTE_USER:-}
      YSQL_PASSWORD_FILE: /run/secrets/YUGABYTE_PASSWORD
    secrets:
      - YUGABYTE_PASSWORD
    ports:
      - "5433:5433" # Accept PostgreSQL-compatible YSQL connections.
      - "7000:7000" # Serve the YugabyteDB master UI.
      - "9000:9000" # Serve the YugabyteDB tserver UI.
      # Peer nodes connect to this guest's pinned address at these ports.
      - "7100:7100" # Accept master peer traffic.
      - "9100:9100" # Accept tserver peer traffic.
    volumes:
      - yugabyte-data:/home/yugabyte/var
      # Apply the read-only yugabyted overlay for upstream PR #23158.
      - /root/tack/yugabyte-overlay/yugabyted:/home/yugabyte/bin/yugabyted:ro
      # Read tserver resource limits and incident notes from the flag file.
      - /root/tack/yugabyte-overlay/tserver.flags:/home/yugabyte/tserver.flags:ro
      - ./yugabyte-overlay/entrypoint.sh:/opt/tack/yugabyte-entrypoint.sh:ro
      - ./yugabyte-overlay/healthcheck.sh:/opt/tack/yugabyte-healthcheck.sh:ro
      - ./yugabyte-overlay/secret.sh:/opt/tack/yugabyte-secret.sh:ro
      - ./yugabyte-overlay/healthcheck.sql:/opt/tack/yugabyte-healthcheck.sql:ro
    healthcheck:
      test: ["CMD", "/usr/bin/env", "bash", "/opt/tack/yugabyte-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      # This health status only provides information. The recorded
      # rolling deployment waited for each node's tablet bootstrap
      # progress instead (TACK-488). The engine does not stop
      # gracefully and replays each tablet's open log segments before
      # SQL answers after a restart. The start period allows replay
      # on a small node without reporting an ordinary restart as
      # unhealthy. A full node can exceed that period and report
      # unhealthy until replay ends; the next passing check reports healthy.
      start_period: 180s

  fdb:
    # Keep FDB_VERSION, the Docker build arguments, and the Go bindings
    # version compatible. The make update-fdb VERSION=... command updates only
    # some pins; review the client library, bindings, and API version as well.
    image: foundationdb/foundationdb:${FDB_VERSION:-7.4.6}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      FDB_NETWORKING_MODE: container
      FDB_PORT: "4500"
      FDB_PROCESS_CLASS: unset
      # Use one cluster file for the server and every client on
      # this guest. The image's default /var/fdb/fdb.cluster is a
      # separate file that clients do not read. In TACK-408,
      # clients missed coordinator changes that the server wrote there.
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      # Configure the guest's cluster identity through Configs; the
      # former Ansible deploy rendered it from the service inventory.
      # Peers and clients on other guests use the pinned guest address,
      # which survives container recreation. The guest name sets the zone,
      # the fault domain used for replication. Local values remain empty;
      # docker compose up announces the container's address and hostname.
      FDB_PUBLIC_ADDRESS: ${FDB_PUBLIC_ADDRESS:-}
      FDB_ZONE_ID: ${FDB_ZONE_ID:-}
      FDB_MACHINE_ID: ${FDB_MACHINE_ID:-}
      # Configure a guest's initial coordinator list through Configs. The former
      # deploy supplied the environment's three coordinators. Once a cluster file
      # exists, the cluster manages it and the process ignores this initial value.
      # Local development leaves it empty and uses the process as its own coordinator.
      FDB_CLUSTER_FILE_CONTENTS: ${FDB_CLUSTER_FILE_CONTENTS:-}
    volumes:
      - fdb-data:/var/fdb
      - /etc/foundationdb:/etc/foundationdb
      # Apply the fdb.bash overlay that handles IPv6 address brackets.
      - /root/tack/fdb-overlay/fdb.bash:/var/fdb/scripts/fdb.bash:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "fdbcli -C /etc/foundationdb/fdb.cluster --exec 'status minimal' 2>&1 | grep -q 'available'",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # The long-running backup_agent writes FoundationDB continuous
  # backups to object storage and processes session snapshots. The
  # ops provision command starts the fdbbackup session when
  # TACK_BACKUP_FDB_CONTINUOUS is true; ops backup fdb-continuous-init
  # permits a deliberate manual start. Both preserve an active session.
  # The backup profile excludes the agent from a plain docker compose
  # up without object storage. The former deploy enabled that profile;
  # Configs must manage it. The fdbbackup client cannot resolve an
  # IPv6 literal. The synthetic fdb-blobstore-host hostname maps to the
  # bare TACK_BACKUP_S3_HOST address. Configure it alongside the full
  # TACK_BACKUP_S3_ENDPOINT through Configs, as the former deploy did.
  #
  # One agent runs on each data guest. Agents divide the
  # session's work; their count controls throughput and survival,
  # and the session does not record that count. Backup continues
  # while any agent runs (TACK-408). The agent retries its own
  # connection and does not depend on fdb. That dependency would
  # start a store process on the owner guest, which must not run one.
  fdb-backup-agent:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.4.6}
    profiles: [backup]
    restart: unless-stopped
    mem_limit: 512m
    entrypoint: ["/usr/bin/backup_agent"]
    command: ["-C", "/etc/foundationdb/fdb.cluster"]
    extra_hosts:
      - "fdb-blobstore-host:${TACK_BACKUP_S3_HOST}"
    volumes:
      # Allow writes because the backup agent's
      # FoundationDB client records coordinator changes
      # in the cluster file, as the app's client does.
      - /etc/foundationdb:/etc/foundationdb

  # Run one OpenSearch member on each search guest. Each
  # member uses the cluster_manager, data, ingest, and ml
  # roles; additional members can join without changes to Tack.
  # Compose requires the search profile. Enable that profile
  # through Configs only on search guests, as the former deploy did.
  #
  # Compose reads node.name and three discovery settings from
  # TACK_SEARCH_* variables in the shell or .env; shell values take
  # precedence. Configs owns the environment and overrides. The former
  # Ansible deploy rendered them. Other service values are literals
  # that an override can replace. Configure QA's
  # TACK_SEARCH_DISCOVERY_TYPE as single-node. Set production
  # TACK_SEARCH_SEED_HOSTS from the member list and
  # TACK_SEARCH_INITIAL_CLUSTER_MANAGER_NODES only for the first tack-search1
  # formation. The image entrypoint converts nonempty dotted variables into settings
  # and leaves empty settings unset. The recorded override also set TLS,
  # credentials, and the member's advertised peer address; Configs must manage those values.
  #
  # Search guests cannot use an IPv4 route. The
  # java.net.preferIPv6Addresses option makes Java select IPv6 for hosts with both
  # address families, including the host from which ML Commons downloads the pinned model.
  #
  # The ML Commons memory breaker rejects
  # predictions when used heap equals or exceeds 85 percent.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    profiles: [search]
    restart: unless-stopped
    # Measurements have not established the stop duration during indexing.
    stop_grace_period: 2m
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms3g -Xmx3g -XX:G1PeriodicGCInterval=5000 -Djava.net.preferIPv6Addresses=true
      node.roles: cluster_manager,data,ingest,ml
      node.name: ${TACK_SEARCH_NODE_NAME:-}
      discovery.type: ${TACK_SEARCH_DISCOVERY_TYPE:-}
      discovery.seed_hosts: ${TACK_SEARCH_SEED_HOSTS:-}
      cluster.initial_cluster_manager_nodes: ${TACK_SEARCH_INITIAL_CLUSTER_MANAGER_NODES:-}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Apache Kafka 4.x runs as both broker and controller with KRaft
  # metadata management. The audit producer publishes to
  # audit.events.v1, and audit-consumer records those events in audit.events.
  #
  # Generate the cluster ID once on the host with this command:
  #
  #   docker run --rm apache/kafka:4.2.0 \
  #     /opt/kafka/bin/kafka-storage.sh random-uuid
  #
  # Save the result as KAFKA_CLUSTER_ID in .env. Recreating the
  # broker must preserve its metadata directory and existing logs. Kafka
  # does not publish external ports; its traffic uses the IPv6 bridge.
  kafka:
    image: apache/kafka:4.2.0
    profiles: [audit]
    restart: unless-stopped
    mem_limit: 2g
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://[::]:9092,CONTROLLER://[::]:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "256"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      # An empty default allows the core stack to parse when the audit
      # profile disables Kafka. Generate KAFKA_CLUSTER_ID with
      # kafka-storage.sh random-uuid and set it in .env before enabling the audit profile.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # The Wave 1 audit-consumer uses its own image
  # and Dockerfile. Its entrypoint invokes
  # /usr/local/bin/audit-consumer directly. The service
  # mounts the signing key for the embedded notarizer.
  audit-consumer:
    image: ghcr.io/agoodkind/tack-audit-consumer:${TACK_IMAGE_TAG:-latest}
    profiles: [audit]
    build:
      context: .
      dockerfile: Dockerfile.audit-consumer
      args:
        COMMIT: ${TACK_COMMIT:-unknown}
        BUILD_TIME: ${TACK_BUILD_TIME:-unknown}
        TAG: ${TACK_TAG:-dev}
        DIRTY: ${TACK_DIRTY:-false}
    restart: unless-stopped
    mem_limit: 1g
    entrypoint: ["/usr/local/bin/audit-consumer"]
    environment:
      AUDIT_CONSUMER_KAFKA_BROKERS: ${AUDIT_CONSUMER_KAFKA_BROKERS:-kafka:9092}
      AUDIT_CONSUMER_KAFKA_TOPIC: ${AUDIT_CONSUMER_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_CONSUMER_GROUP_ID: ${AUDIT_CONSUMER_GROUP_ID:-tack-audit-projector}
      AUDIT_CONSUMER_BATCH_SIZE: ${AUDIT_CONSUMER_BATCH_SIZE:-256}
      AUDIT_CONSUMER_POLL_INTERVAL: ${AUDIT_CONSUMER_POLL_INTERVAL:-250ms}
      AUDIT_CONSUMER_YUGABYTE_DSN_FILE: /run/secrets/AUDIT_CONSUMER_YUGABYTE_DSN
      AUDIT_CONSUMER_SIGNING_KEY_PATH: ${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}
      # Each notarization records the signing guest's claimed origin
      # (TACK-437). Supply the guest's inventory name through Configs, as
      # the former deploy did. An empty value uses the container's hostname.
      AUDIT_CONSUMER_SIGNING_HOST: ${AUDIT_CONSUMER_SIGNING_HOST:-}
      # Set this cluster file to enable the FoundationDB
      # operator relay. An unreadable configured file prevents
      # consumer startup and stops both the FoundationDB and
      # YugabyteDB relays. Keep the value optional: a host without
      # the mount can leave it empty and run only the YugabyteDB relay.
      FDB_CLUSTER_FILE: ${AUDIT_CONSUMER_FDB_CLUSTER_FILE:-}
      # The consumer reads the app's required ENV value and
      # includes the environment in each log event (TACK-263).
      ENV: ${ENV:?ENV is required, set it in .env}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_JSON_FILE: /var/log/tack/audit-consumer.jsonl
      LOG_TEXT_FILE: /var/log/tack/audit-consumer.log
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-0}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-0}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-100}
    secrets:
      - AUDIT_CONSUMER_YUGABYTE_DSN
    volumes:
      - tack-logs:/var/log/tack
      - ${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}:${AUDIT_CONSUMER_SIGNING_KEY_PATH:-/etc/tack/audit-signing.pem}:ro
      # Allow writes because this process's FoundationDB client
      # records coordinator changes in the cluster file (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
    # The consumer does not depend on yugabyte. Configure its database connection string
    # (DSN) for the data guests through Configs. The recorded deployment used a multi-host
    # DSN. Startup pings retry until the ledger answers without requiring service ordering.
    depends_on:
      kafka:
        condition: service_started

  # Run this temporary operator container for backup,
  # verification, and restore-test operations. The ops profile
  # excludes it from a default docker compose up. Invoke it with:
  #   docker compose run --rm tack-ops ops backup [subcommand] [args]
  tack-ops:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    profiles: [ops]
    mem_limit: 512m
    entrypoint: ["/server"]
    network_mode: host
    environment:
      # The tack-ops service uses host networking. Its database connection
      # uses a separate TACK_OPS_DATABASE_URL secret for the host
      # endpoint, locally 127.0.0.1:5433. The app's yugabyte hostname does
      # not resolve through host networking; do not reuse the app's DSN here.
      <<: *opensearch_environment
      OPENSEARCH_MAINTENANCE_USERNAME: ${OPENSEARCH_MAINTENANCE_USERNAME:-}
      OPENSEARCH_MAINTENANCE_PASSWORD_FILE: /run/secrets/OPENSEARCH_MAINTENANCE_PASSWORD
      DATABASE_URL_FILE: /run/secrets/TACK_OPS_DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_OPERATOR_DSN
      # The audit query, audit get, audit export, and audit redact-actor host
      # commands use these ledger connections. Configure host-network endpoints
      # like the operator connection. Supply their secret files through Configs.
      AUDIT_READER_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_READER_DSN
      AUDIT_REDACTOR_DSN_FILE: /run/secrets/TACK_OPS_AUDIT_REDACTOR_DSN
      # The audit verify command uses the app's accepted signer identifiers
      # to judge bundle signatures (TACK-437). Run audit signers through
      # the app service because this container does not mount a signing key.
      AUDIT_VALID_SIGNERS: ${AUDIT_VALID_SIGNERS:-}
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      # The ops provision command sets redundancy only on an
      # unconfigured store. Use single for local and single-guest
      # environments. Configure double through Configs for one process
      # per data guest, as the former deploy did. Rebuilding must
      # restore that replication instead of one copy per key (TACK-408).
      TACK_OPS_FDB_REDUNDANCY_MODE: ${TACK_OPS_FDB_REDUNDANCY_MODE:-single}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Require the same ENV value as the app. A default here
      # could run this container in production mode while the
      # host's .env selects development. Read the declared
      # environment consistently across services (TACK-261).
      ENV: ${ENV:?ENV is required, set it in .env}
      # Backup dumps read this database as
      # tack_migrator with TACK_MIGRATOR_PASSWORD.
      YUGABYTE_DB: ${YUGABYTE_DB:?YUGABYTE_DB is required, set it in .env}
      # The ops audit seed-roles command creates or rotates audit LOGIN roles and rejects
      # missing passwords. Configuration loading requires every referenced secret file,
      # including these files, to exist and contain a value before backup or any other command runs.
      AUDIT_WRITER_PASSWORD_FILE: /run/secrets/AUDIT_WRITER_PASSWORD
      AUDIT_READER_PASSWORD_FILE: /run/secrets/AUDIT_READER_PASSWORD
      AUDIT_REDACTOR_PASSWORD_FILE: /run/secrets/AUDIT_REDACTOR_PASSWORD
      AUDIT_OPERATOR_PASSWORD_FILE: /run/secrets/AUDIT_OPERATOR_PASSWORD
      # The same seed-roles command sets the app login's password
      # (TACK-180). The app reads that password in DATABASE_URL.
      TACK_APP_PASSWORD_FILE: /run/secrets/TACK_APP_PASSWORD
      TACK_MIGRATOR_PASSWORD_FILE: /run/secrets/TACK_MIGRATOR_PASSWORD
      # FoundationDB continuous backup uses this object-store
      # endpoint to construct its blobstore destination URL.
      TACK_BACKUP_S3_ENDPOINT: ${TACK_BACKUP_S3_ENDPOINT:-}
      TACK_BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/TACK_BACKUP_S3_ACCESS_KEY_ID
      TACK_BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/TACK_BACKUP_S3_SECRET_ACCESS_KEY
      TACK_BACKUP_S3_REGION: ${TACK_BACKUP_S3_REGION:-us-east-1}
      TACK_BACKUP_S3_BUCKET_MAIN: ${TACK_BACKUP_S3_BUCKET_MAIN:-tack-backups}
      # Configure the temporary backup containers' master quorum from the
      # ledger topology through Configs, as the former deploy did. The
      # fallback uses the local development node and matches the compiled default.
      TACK_BACKUP_YB_MASTER_ADDRESSES: ${TACK_BACKUP_YB_MASTER_ADDRESSES:-yugabyte:7100}
      # Use Configs to map each ledger node name to its guest address, as the former
      # deploy did (TACK-460). SQL dumpers use the node name to verify encrypted
      # nodes against certificates. Leave the value empty for unencrypted connections.
      TACK_LEDGER_NODE_HOSTS: ${TACK_LEDGER_NODE_HOSTS:-}
      # The yugabyte service, backup tools (yb-admin, ysql_dump,
      # and ysql_dumpall), and restore drill's temporary engine
      # share this image. Dumpers and restores must match the
      # cluster version. The binary does not supply a default: a
      # former 2025.2 default conflicted with the 2024.2 cluster
      # and caused schema application to fail during the drill.
      TACK_BACKUP_YB_IMAGE: *yugabyte_image
      # Declare the snapshot-export paths explicitly.
      # Commands that need them reject empty values
      # instead of archiving or restoring the wrong location.
      TACK_BACKUP_YB_ROCKSDB_DIR: ${TACK_BACKUP_YB_ROCKSDB_DIR:-}
      TACK_BACKUP_YB_OVERLAY_PATH: ${TACK_BACKUP_YB_OVERLAY_PATH:-}
      # A staleness-check run emails a plain explanation when
      # it first detects a backup older than its limit. Supply
      # the recipient through Configs, as the former deploy
      # did. An empty recipient disables email for local runs.
      TACK_BACKUP_ALARM_EMAIL: ${TACK_BACKUP_ALARM_EMAIL:-}
      TACK_BACKUP_ALARM_MSMTPRC: ${TACK_BACKUP_ALARM_MSMTPRC:-/etc/msmtprc}
      # Configure the window for the primary's recorded runs and the grace period within this run (TACK-481).
      # An empty primary service makes this checker primary.
      # For each new stale fault, the deputy defers when a ledger query finds the primary's
      # staleness-check event within that window.
      # After a successful lookup without a recent event, the deputy waits within this
      # run and queries again. If the query still cannot establish a recent primary run,
      # or either lookup fails, the deputy attempts alarm delivery.
      # An earlier missing setting made a data guest act as primary and send a duplicate fault email.
      TACK_BACKUP_ALARM_PRIMARY_SERVICE: ${TACK_BACKUP_ALARM_PRIMARY_SERVICE:-}
      TACK_BACKUP_ALARM_PRIMARY_WINDOW_SECONDS: ${TACK_BACKUP_ALARM_PRIMARY_WINDOW_SECONDS:-1500}
      TACK_BACKUP_ALARM_PRIMARY_GRACE_SECONDS: ${TACK_BACKUP_ALARM_PRIMARY_GRACE_SECONDS:-90}
      # Pass the FoundationDB continuous-backup setting into this container.
      # Otherwise its compiled false default disables the backup session during
      # provisioning and excludes FoundationDB from restore drills and staleness
      # checks even when the host enables it. Supply the patched fdb.bash
      # overlay on the guest through Configs, as the former deploy did. The
      # restore drill mounts it into its temporary cluster. Require the overlay path
      # explicitly; an empty value must fail instead of selecting a different file.
      TACK_BACKUP_FDB_CONTINUOUS: ${TACK_BACKUP_FDB_CONTINUOUS:-false}
      TACK_BACKUP_FDB_OVERLAY_PATH: ${TACK_BACKUP_FDB_OVERLAY_PATH:-}
      # Ledger DSNs already include sslmode and the
      # certificate authority's path (TACK-460). Temporary
      # backup and snapshot containers also run the engine
      # administration tool, which takes a certificate directory
      # flag. Pass both TLS settings into those containers; without
      # them, the tool cannot authenticate to an encrypted cluster.
      TACK_LEDGER_TLS_ENABLED: ${TACK_LEDGER_TLS_ENABLED:-false}
      TACK_LEDGER_CERTS_DIR: ${TACK_LEDGER_CERTS_DIR:-}
      # The ops deploy verify command checks running app images
      # against the tag that this stack and the deploy specify.
      TACK_IMAGE_TAG: ${TACK_IMAGE_TAG:-latest}
    secrets:
      - TACK_OPS_DATABASE_URL
      - TACK_LEDGER_SUPERUSER_DATABASE_URL
      - TACK_OPS_AUDIT_OPERATOR_DSN
      - TACK_OPS_AUDIT_READER_DSN
      - TACK_OPS_AUDIT_REDACTOR_DSN
      - AUDIT_WRITER_PASSWORD
      - AUDIT_READER_PASSWORD
      - AUDIT_REDACTOR_PASSWORD
      - AUDIT_OPERATOR_PASSWORD
      - TACK_APP_PASSWORD
      - TACK_MIGRATOR_PASSWORD
      - TACK_BACKUP_S3_ACCESS_KEY_ID
      - TACK_BACKUP_S3_SECRET_ACCESS_KEY
      - OPENSEARCH_PASSWORD
      - OPENSEARCH_CURSOR_KEY
      - OPENSEARCH_MAINTENANCE_PASSWORD
    volumes:
      - /root/backups:/root/backups
      # Allow writes because operator commands use
      # the FoundationDB client, which records
      # coordinator changes in this cluster file (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      # The staleness alarm reads the guest's SMTP account from this
      # file and sends mail with SMTP directly. The image does not
      # contain an msmtp binary, and the alarm does not execute one.
      - /etc/msmtprc:/etc/msmtprc:ro
      # Mount only the ledger certificate directory for the
      # database connections and temporary containers. Do
      # not mount all of /etc/tack: the adjacent audit
      # signing key must remain unavailable to this container.
      - ${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:ro
      # Allow the Docker socket only in this temporary ops
      # container for backup commands that create temporary
      # containers on the local daemon. Do not add this
      # mount to the long-running app service. Preserve this
      # restriction when changing the sibling-container design.
      - /var/run/docker.sock:/var/run/docker.sock

  # Run ops audit consumer-offsets, ops audit dlq inspect, and ops
  # audit dlq replay in this temporary operator container. Each
  # command opens both the ledger reader and Kafka broker.
  # Host-networked tack-ops cannot resolve the broker, and the app does
  # not mount ledger reader credentials. This service uses the bridge
  # network and provides both connections (TACK-610). Invoke it with:
  #   docker compose run --rm audit-ops ops audit [subcommand] [args]
  audit-ops:
    image: ghcr.io/agoodkind/tack-server:${TACK_IMAGE_TAG:-latest}
    profiles: [ops]
    mem_limit: 256m
    entrypoint: ["/server"]
    environment:
      # Every command loads the application login.
      # These commands do not read auth tables with it.
      DATABASE_URL_FILE: /run/secrets/DATABASE_URL
      AUDIT_OPERATOR_DSN_FILE: /run/secrets/AUDIT_OPERATOR_DSN
      AUDIT_READER_DSN_FILE: /run/secrets/AUDIT_READER_DSN
      AUDIT_KAFKA_BROKERS: ${AUDIT_KAFKA_BROKERS:-}
      AUDIT_KAFKA_TOPIC: ${AUDIT_KAFKA_TOPIC:-audit.events.v1}
      AUDIT_KAFKA_PRODUCE_TIMEOUT: ${AUDIT_KAFKA_PRODUCE_TIMEOUT:-15s}
      # consumer-offsets also counts the FoundationDB operator outbox.
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      FDB_TRANSACTION_TIMEOUT: ${FDB_TRANSACTION_TIMEOUT:-5s}
      ENV: ${ENV:?ENV is required, set it in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - DATABASE_URL
      - AUDIT_OPERATOR_DSN
      - AUDIT_READER_DSN
    volumes:
      # Allow FoundationDB client writes for coordinator updates (TACK-408).
      - /etc/foundationdb:/etc/foundationdb
      - ${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:${TACK_LEDGER_CERTS_DIR:-/etc/tack/ledger-certs}:ro

secrets:
  DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/DATABASE_URL
  AUDIT_WRITER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_WRITER_DSN
  AUDIT_OPERATOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_OPERATOR_DSN
  AUDIT_READER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_READER_DSN
  AUDIT_CONSUMER_YUGABYTE_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_CONSUMER_YUGABYTE_DSN
  TACK_OPS_DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_DATABASE_URL
  TACK_LEDGER_SUPERUSER_DATABASE_URL:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_LEDGER_SUPERUSER_DATABASE_URL
  TACK_OPS_AUDIT_OPERATOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_OPERATOR_DSN
  TACK_OPS_AUDIT_READER_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_READER_DSN
  TACK_OPS_AUDIT_REDACTOR_DSN:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_OPS_AUDIT_REDACTOR_DSN
  AUDIT_WRITER_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_WRITER_PASSWORD
  AUDIT_READER_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_READER_PASSWORD
  AUDIT_REDACTOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_REDACTOR_PASSWORD
  AUDIT_OPERATOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/AUDIT_OPERATOR_PASSWORD
  TACK_APP_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_APP_PASSWORD
  TACK_MIGRATOR_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_MIGRATOR_PASSWORD
  YUGABYTE_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/YUGABYTE_PASSWORD
  TACK_BACKUP_S3_ACCESS_KEY_ID:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_BACKUP_S3_ACCESS_KEY_ID
  TACK_BACKUP_S3_SECRET_ACCESS_KEY:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/TACK_BACKUP_S3_SECRET_ACCESS_KEY
  OPENSEARCH_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_PASSWORD
  OPENSEARCH_CURSOR_KEY:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_CURSOR_KEY
  OPENSEARCH_MAINTENANCE_PASSWORD:
    file: ${TACK_SECRETS_DIR:-/var/lib/tack/secrets}/OPENSEARCH_MAINTENANCE_PASSWORD

volumes:
  yugabyte-data:
  fdb-data:
  tack-logs:
  kafka-data:
  opensearch-data:

# Use an IPv6-only bridge. Each host allocates a /96 subnet from its on-link
# /64. The ndppd service proxies Neighbor Discovery Protocol (NDP) requests on
# eth0; containers use globally routable IPv6 addresses without masquerading in
# routed gateway mode. Docker DNS returns only AAAA records because enable_ipv4
# is false. Do not enable dual-stack networking. Supply each host's
# tack_docker_v6_subnet and tack_docker_v6_gateway through Configs, as the former
# deploy did. The production-prefix defaults allow parsing without a rendered environment.
networks:
  default:
    enable_ipv6: true
    enable_ipv4: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_v6: routed
    ipam:
      config:
        - subnet: ${TACK_DOCKER_V6_SUBNET:-3d06:bad:b01:0:7ac::/96}
          gateway: ${TACK_DOCKER_V6_GATEWAY:-3d06:bad:b01:0:7ac::1}
