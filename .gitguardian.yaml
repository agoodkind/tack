# Ignore vendored upstream files with public default constants that
# trigger generic secret detectors in this repository's ggshield configuration.
version: 2

secret:
  ignored_paths:
    - yugabyte-overlay/yugabyted
  ignored_matches:
    - name: yugabyted upstream DEFAULT_YSQL_PASSWORD constant
      match: e8c13d18181abe05fa2a88cdccef3270f715486e513f8be3454b6dd5b794e1fa
