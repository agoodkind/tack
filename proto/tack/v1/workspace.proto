syntax = "proto3";

package tack.v1;

import "tack/v1/common.proto";
import "tack/v1/node.proto";
import "google/protobuf/empty.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

message Workspace {
  Base base = 1;
  string org_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
}

message CreateWorkspaceRequest {
  string org_id = 1;
  string name = 2;
  string slug = 3;
  optional string description = 4;
}

message GetWorkspaceRequest {
  string org_id = 1;
  string id = 2;
}

// org_id is optional. If omitted the server returns all workspaces the
// authenticated user can access across all orgs.
message ListWorkspacesRequest {
  optional string org_id = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  string org_id = 1;
  string id = 2;
  optional string name = 3;
  optional string description = 4;
}

message DeleteWorkspaceRequest {
  string org_id = 1;
  string id = 2;
}

// WorkspaceDescription is returned by DescribeWorkspace.
// It carries the workspace metadata and all node types seeded for the org,
// so callers can enumerate available tools without extra round trips.
message WorkspaceDescription {
  Workspace workspace = 1;
  repeated NodeTypeDefinition node_types = 2;
}

message DescribeWorkspaceRequest {
  // Workspace slug, e.g. "eng-platform". Prefer slug over UUID in user-facing calls.
  string slug = 1;
}

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (google.protobuf.Empty);
  rpc DescribeWorkspace(DescribeWorkspaceRequest) returns (WorkspaceDescription);
}
