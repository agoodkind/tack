syntax = "proto3";

package tack.v1;

import "tack/v1/common.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/agoodkind/tack/gen/tack/v1;tackv1";

message State {
  Base base = 1;
  string project_id = 2;
  string name = 3;
  StateGroup group = 4;
  string color = 5;
  int32 sort_order = 6;
}

message CreateStateRequest {
  string workspace_id = 1;
  string project_id = 2;
  string name = 3;
  StateGroup group = 4;
  string color = 5;
  optional int32 sort_order = 6;
}

message GetStateRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

message ListStatesRequest {
  string workspace_id = 1;
  string project_id = 2;
}

message ListStatesResponse {
  repeated State states = 1;
}

message UpdateStateRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
  optional string name = 4;
  optional StateGroup group = 5;
  optional string color = 6;
  optional int32 sort_order = 7;
}

message DeleteStateRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

service StateService {
  rpc CreateState(CreateStateRequest) returns (State);
  rpc GetState(GetStateRequest) returns (State);
  rpc ListStates(ListStatesRequest) returns (ListStatesResponse);
  rpc UpdateState(UpdateStateRequest) returns (State);
  rpc DeleteState(DeleteStateRequest) returns (google.protobuf.Empty);
}
