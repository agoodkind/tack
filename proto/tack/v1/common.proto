syntax = "proto3";

package tack.v1;

import "google/protobuf/timestamp.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

// Base fields shared by all entities.
message Base {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string created_by = 4;
  optional string updated_by = 5;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_NONE = 1;
  PRIORITY_URGENT = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_MEDIUM = 4;
  PRIORITY_LOW = 5;
}

enum StateGroup {
  STATE_GROUP_UNSPECIFIED = 0;
  STATE_GROUP_BACKLOG = 1;
  STATE_GROUP_TODO = 2;
  STATE_GROUP_STARTED = 3;
  STATE_GROUP_COMPLETED = 4;
  STATE_GROUP_CANCELLED = 5;
}
