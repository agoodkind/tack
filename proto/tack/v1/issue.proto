syntax = "proto3";

package tack.v1;

import "tack/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

message Issue {
  Base base = 1;
  string workspace_id = 2;
  string project_id = 3;
  string name = 4;
  optional string description = 5;
  Priority priority = 6;
  string state_id = 7;
  optional string sequence_id = 8;
  optional string epic_id = 9;
  optional string parent_id = 10;
  repeated string assignee_ids = 11;
  repeated string label_ids = 12;
  optional google.protobuf.Timestamp due_date = 13;
  optional int32 estimate = 14;
}

message CreateIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string name = 3;
  optional string description = 4;
  optional Priority priority = 5;
  optional string state_id = 6;
  optional string epic_id = 7;
  optional string parent_id = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
  optional google.protobuf.Timestamp due_date = 11;
  optional int32 estimate = 12;
}

message GetIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

message ListIssuesRequest {
  string workspace_id = 1;
  optional string project_id = 2;
  optional string epic_id = 3;
  optional string parent_id = 4;
  optional string state_id = 5;
  optional Priority priority = 6;
  optional string assignee_id = 7;
  optional int32 page = 8;
  optional int32 page_size = 9;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  int32 total = 2;
}

message UpdateIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
  optional string name = 4;
  optional string description = 5;
  optional Priority priority = 6;
  optional string state_id = 7;
  optional string epic_id = 8;
  optional string parent_id = 9;
  optional google.protobuf.Timestamp due_date = 10;
  optional int32 estimate = 11;
}

message DeleteIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

message AssignIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string issue_id = 3;
  string user_id = 4;
}

message UnassignIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string issue_id = 3;
  string user_id = 4;
}

message SetIssueEpicRequest {
  string workspace_id = 1;
  string project_id = 2;
  string issue_id = 3;
  optional string epic_id = 4;
}

message SearchIssuesRequest {
  string workspace_id = 1;
  string query = 2;
  optional string project_id = 3;
  optional int32 page = 4;
  optional int32 page_size = 5;
}

message SearchIssuesResponse {
  repeated Issue issues = 1;
  int32 total = 2;
}

message MoveIssueRequest {
  string workspace_id = 1;
  string project_id = 2;
  string issue_id = 3;
  string target_project_id = 4;
}

message BulkUpdateIssuesRequest {
  string workspace_id = 1;
  string project_id = 2;
  repeated string issue_ids = 3;
  optional string state_id = 4;
  optional string priority = 5;
  optional string epic_id = 6;
  bool clear_epic = 7;
  repeated string assignee_ids = 8;
}

message BulkUpdateIssuesResponse {
  int32 updated = 1;
}

message BulkDeleteIssuesRequest {
  string workspace_id = 1;
  string project_id = 2;
  repeated string issue_ids = 3;
}

message BulkDeleteIssuesResponse {
  int32 deleted = 1;
}

message BulkMoveIssuesRequest {
  string workspace_id = 1;
  string project_id = 2;
  repeated string issue_ids = 3;
  string target_project_id = 4;
}

message BulkMoveIssuesResponse {
  int32 moved = 1;
  int32 failed = 2;
}

service IssueService {
  rpc CreateIssue(CreateIssueRequest) returns (Issue);
  rpc GetIssue(GetIssueRequest) returns (Issue);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  // StreamIssues is the server-streaming equivalent of ListIssues for large
  // or unbounded result sets. Backed by NodeReader.Stream; results flow as
  // parallel FDB chunks complete. Prefer ListIssues for bounded/paginated queries.
  rpc StreamIssues(ListIssuesRequest) returns (stream Issue);
  rpc UpdateIssue(UpdateIssueRequest) returns (Issue);
  rpc DeleteIssue(DeleteIssueRequest) returns (google.protobuf.Empty);
  rpc AssignIssue(AssignIssueRequest) returns (Issue);
  rpc UnassignIssue(UnassignIssueRequest) returns (Issue);
  rpc SetIssueEpic(SetIssueEpicRequest) returns (Issue);
  rpc SearchIssues(SearchIssuesRequest) returns (SearchIssuesResponse);
  rpc MoveIssue(MoveIssueRequest) returns (Issue);
  rpc BulkUpdateIssues(BulkUpdateIssuesRequest) returns (BulkUpdateIssuesResponse);
  rpc BulkDeleteIssues(BulkDeleteIssuesRequest) returns (BulkDeleteIssuesResponse);
  rpc BulkMoveIssues(BulkMoveIssuesRequest) returns (BulkMoveIssuesResponse);
}
