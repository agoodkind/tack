syntax = "proto3";

package tack.v1;

import "tack/v1/common.proto";
import "google/protobuf/empty.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

message Epic {
  Base base = 1;
  string workspace_id = 2;
  string project_id = 3;
  string name = 4;
  optional string description = 5;
  Priority priority = 6;
  optional string state_id = 7;
  optional string parent_id = 8;
  repeated string assignee_ids = 9;
  repeated string label_ids = 10;
}

message CreateEpicRequest {
  string workspace_id = 1;
  string project_id = 2;
  string name = 3;
  optional string description = 4;
  optional Priority priority = 5;
  optional string state_id = 6;
  optional string parent_id = 7;
}

message GetEpicRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

message ListEpicsRequest {
  string workspace_id = 1;
  string project_id = 2;
}

message ListEpicsResponse {
  repeated Epic epics = 1;
}

message UpdateEpicRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
  optional string name = 4;
  optional string description = 5;
  optional Priority priority = 6;
  optional string state_id = 7;
}

message DeleteEpicRequest {
  string workspace_id = 1;
  string project_id = 2;
  string id = 3;
}

service EpicService {
  rpc CreateEpic(CreateEpicRequest) returns (Epic);
  rpc GetEpic(GetEpicRequest) returns (Epic);
  rpc ListEpics(ListEpicsRequest) returns (ListEpicsResponse);
  rpc UpdateEpic(UpdateEpicRequest) returns (Epic);
  rpc DeleteEpic(DeleteEpicRequest) returns (google.protobuf.Empty);
}
