syntax = "proto3";

package tack.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

// Node is the single primary record for every entity in the system. Every
// concept-specific value (workspace, project, state, assignees, labels,
// priority, due dates, description) lives in props as JSON-encoded property
// values keyed by PropertyDef name. Everything that connects nodes together
// lives in Relationship records, not on the node itself.
message Node {
  string id         = 1;
  string org_id     = 2;
  string node_type  = 3;
  string name       = 4;
  // props is a free-form map of PropertyDef name -> JSON value. Filterability
  // of a given property comes from PropertyDef.indexed, not proto shape.
  google.protobuf.Struct props = 5;
  string created_by = 6;
  string updated_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Relationship is a generic directed edge between two nodes. The relation_type
// string carries the semantics: "assigned_to", "labeled_with", "child_of",
// "watches", "mentioned_in", "reacted_to", "comment_of", etc.
message Relationship {
  string org_id        = 1;
  string source_id     = 2;
  string relation_type = 3;
  string target_id     = 4;
  string created_by    = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Struct props = 7;
}

// EnumOption is one option in a select or multi-select property.
message EnumOption {
  string key       = 1;
  string label     = 2;
  string color     = 3;
  int32  sort_rank = 4;
}

// PropertyDef defines a property that can be attached to one or more node types.
// A PropertyDef applies to a NodeType when applies_to_features is empty (applies
// to all) or when the NodeType declares any of the listed features.
message PropertyDef {
  string            id                   = 1;
  string            org_id               = 2;
  string            name                 = 3;
  string            type                 = 4; // text, number, date, select, multi_select, url, checkbox, timestamp, uuid
  repeated string   applies_to_features  = 5;
  bool              indexed              = 6;
  bool              required             = 7;
  bytes             default_value        = 8; // raw JSON
  repeated EnumOption options             = 9;
}

// NodeType describes a type in the extensibility hierarchy. NodeType records
// are themselves nodes stored in the same key space as any other node.
message NodeType {
  string            id              = 1;
  string            org_id          = 2;
  string            name            = 3;
  string            slug            = 4;
  string            color           = 5;
  string            icon            = 6;
  repeated string   allowed_ops     = 7;
  repeated string   property_def_ids = 8;
  string            plural_slug     = 9;
  bool              is_builtin      = 10;
  string            type_key        = 11;
  repeated string   features        = 12;
  repeated string   can_contain     = 13;
  repeated string   can_live_under  = 14;
}

// ── RPC surface (generic node service) ────────────────────────────────────
//
// The RPC layer is intentionally shallow: a handful of node-level operations
// plus relationship add / remove / list. The frontend / TUI gets a uniform
// surface regardless of NodeType; concept-specific semantics are expressed
// through props and relation_type strings.

message CreateNodeRequest {
  string parent_id     = 1;
  string node_type_key = 2;
  string name          = 3;
  google.protobuf.Struct props = 4;
  repeated Relationship relationships = 5;
}

message CreateNodeResponse { Node node = 1; }

message GetNodeRequest { string node_id = 1; }
message GetNodeResponse { Node node = 1; }

message UpdateNodeRequest {
  string node_id = 1;
  string name    = 2;
  google.protobuf.Struct props = 3;
}
message UpdateNodeResponse { Node node = 1; }

message DeleteNodeRequest { string node_id = 1; }
message DeleteNodeResponse { bool ok = 1; }

message ListNodesRequest {
  string org_id       = 1;
  string node_type    = 2;
  string prop_name    = 3; // optional index selector
  bytes  prop_value   = 4; // raw JSON
  int32  limit        = 5;
  string cursor       = 6;
}
message ListNodesResponse {
  repeated Node nodes = 1;
  string next_cursor  = 2;
}

message AddRelationshipRequest   { Relationship relationship = 1; }
message AddRelationshipResponse  { bool ok = 1; }

message RemoveRelationshipRequest {
  string org_id        = 1;
  string source_id     = 2;
  string relation_type = 3;
  string target_id     = 4;
}
message RemoveRelationshipResponse { bool ok = 1; }

message ListRelationshipsRequest {
  string org_id        = 1;
  string node_id       = 2;
  string direction     = 3; // "out" or "in"
  string relation_type = 4; // optional
}
message ListRelationshipsResponse { repeated Relationship relationships = 1; }

service NodeService {
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  rpc AddRelationship(AddRelationshipRequest) returns (AddRelationshipResponse);
  rpc RemoveRelationship(RemoveRelationshipRequest) returns (RemoveRelationshipResponse);
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse);
}
