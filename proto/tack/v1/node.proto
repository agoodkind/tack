syntax = "proto3";

package tack.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

// Node is the single primary record for every entity in the system.
//
// Store every concept-specific value in props as a JSON value keyed by
// PropertyDef name. JSON is a text format for data. This protobuf field
// represents those values with message fields rather than
// their JSON text bytes.
//
// These values represent the following concepts:
//
// - workspace
// - project
// - state
// - assignees
// - labels
// - priority
// - due dates
// - description
//
// Store connections between nodes in Relationship records rather than on
// Node itself.
message Node {
  string id         = 1;
  string org_id     = 2;
  string node_type  = 3;
  string name       = 4;

  // props maps PropertyDef names to arbitrary JSON values in
  // google.protobuf.Struct.
  //
  // A property index stores lookup keys that combine a property value with a
  // node ID. PropertyDef.indexed controls whether the database maintains
  // those keys. Filtering does not depend on the protobuf shape. A scan
  // reads stored records or index entries in order; filters can also compare
  // property values after a scan.
  google.protobuf.Struct props = 5;
  string created_by = 6;
  string updated_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Relationship records a generic directed connection from one node to
// another. The relation_type string specifies the meaning
// of the relationship.
//
// Examples include these relation_type values:
//
// - "assigned_to"
// - "labeled_with"
// - "child_of"
// - "watches"
// - "mentioned_in"
// - "reacted_to"
// - "comment_of"
message Relationship {
  string org_id        = 1;
  string source_id     = 2;
  string relation_type = 3;
  string target_id     = 4;
  string created_by    = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Struct props = 7;
}

// EnumOption is one option in a select or multi-select property.
message EnumOption {
  string key       = 1;
  string label     = 2;
  string color     = 3;
  int32  sort_rank = 4;
}

// PropertyDef defines a property for one or more node types.
// A PropertyDef applies to every NodeType when applies_to_features is empty.
// Otherwise, it applies when the NodeType declares any listed feature.
message PropertyDef {
  string            id                   = 1;
  string            org_id               = 2;
  string            name                 = 3;

  // Use one of these property types:
  //
  // - text
  // - number
  // - date
  // - select
  // - multi_select
  // - url
  // - checkbox
  // - timestamp
  // - uuid
  string            type                 = 4;
  repeated string   applies_to_features  = 5;
  bool              indexed              = 6;
  bool              required             = 7;

  // default_value stores raw JSON: bytes that contain the
  // text of a JSON value.
  bytes             default_value        = 8;
  repeated EnumOption options             = 9;
}

// NodeType defines types that can extend the node model. Its feature
// declarations control behavior. Its hierarchy declarations specify which
// types can contain other types.
//
// Store each NodeType record as a node. Use the same database key patterns
// for these records and other nodes; each key identifies a stored record.
message NodeType {
  string            id              = 1;
  string            org_id          = 2;
  string            name            = 3;
  string            slug            = 4;
  string            color           = 5;
  string            icon            = 6;
  repeated string   allowed_ops     = 7;
  repeated string   property_def_ids = 8;
  string            plural_slug     = 9;
  bool              is_builtin      = 10;
  string            type_key        = 11;
  repeated string   features        = 12;
  repeated string   can_contain     = 13;
  repeated string   can_live_under  = 14;
}


message CreateNodeRequest {
  string parent_id     = 1;
  string node_type_key = 2;
  string name          = 3;
  google.protobuf.Struct props = 4;
  repeated Relationship relationships = 5;
}

message CreateNodeResponse { Node node = 1; }

message GetNodeRequest { string node_id = 1; }
message GetNodeResponse { Node node = 1; }

message UpdateNodeRequest {
  string node_id = 1;
  string name    = 2;
  google.protobuf.Struct props = 3;
}
message UpdateNodeResponse { Node node = 1; }

message DeleteNodeRequest { string node_id = 1; }
message DeleteNodeResponse { bool ok = 1; }

message ListNodesRequest {
  string org_id       = 1;
  string node_type    = 2;

  // prop_name optionally selects a property index. The index uses a property
  // value to look up matching node IDs.
  string prop_name    = 3;

  // prop_value stores raw JSON: bytes that contain the text of a JSON value.
  bytes  prop_value   = 4;
  int32  limit        = 5;
  string cursor       = 6;
}
message ListNodesResponse {
  repeated Node nodes = 1;
  string next_cursor  = 2;
}

message AddRelationshipRequest   { Relationship relationship = 1; }
message AddRelationshipResponse  { bool ok = 1; }

message RemoveRelationshipRequest {
  string org_id        = 1;
  string source_id     = 2;
  string relation_type = 3;
  string target_id     = 4;
}
message RemoveRelationshipResponse { bool ok = 1; }

message ListRelationshipsRequest {
  string org_id        = 1;
  string node_id       = 2;

  // Use "out" or "in" for direction.
  string direction     = 3;

  // relation_type is optional.
  string relation_type = 4;
}
message ListRelationshipsResponse { repeated Relationship relationships = 1; }

// NodeService declares a small, generic remote procedure call (RPC) API.
//
// The API provides these operations:
//
// - Node operations
// - Relationship addition
// - Relationship removal
// - Relationship listing
//
// The frontend and terminal user interface (TUI) share the same
// contract for every NodeType. props and relation_type strings express
// the meaning of each concept.
service NodeService {
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  rpc AddRelationship(AddRelationshipRequest) returns (AddRelationshipResponse);
  rpc RemoveRelationship(RemoveRelationshipRequest) returns (RemoveRelationshipResponse);
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse);
}
