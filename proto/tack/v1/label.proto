syntax = "proto3";

package tack.v1;

import "tack/v1/common.proto";
import "google/protobuf/empty.proto";

option go_package = "goodkind.io/tack/gen/tack/v1;tackv1";

message Label {
  Base base = 1;
  string workspace_id = 2;
  optional string project_id = 3;
  string name = 4;
  string color = 5;
  int32 sort_order = 6;
}

message CreateLabelRequest {
  string workspace_id = 1;
  optional string project_id = 2;
  string name = 3;
  string color = 4;
  optional int32 sort_order = 5;
}

message GetLabelRequest {
  string workspace_id = 1;
  string id = 2;
}

message ListLabelsRequest {
  string workspace_id = 1;
  optional string project_id = 2;
}

message ListLabelsResponse {
  repeated Label labels = 1;
}

message UpdateLabelRequest {
  string workspace_id = 1;
  string id = 2;
  optional string name = 3;
  optional string color = 4;
  optional int32 sort_order = 5;
}

message DeleteLabelRequest {
  string workspace_id = 1;
  string id = 2;
}

service LabelService {
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  rpc GetLabel(GetLabelRequest) returns (Label);
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  rpc UpdateLabel(UpdateLabelRequest) returns (Label);
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);
}
