# Run local Go tests in containers.
#
# The tests service builds a Go image with the production server's
# FoundationDB client library and runs go test against the working
# tree's bind mount. The make test-unit and make test-integration
# commands run it and set TACK_TEST_ROOT to the tree's host path.
#
# Tests start their own stores through internal/testenv and the
# Docker SDK using the mounted daemon socket. Each test binary
# starts single-node FoundationDB and YugabyteDB engines on
# tack-testenv and attaches this container to that network.
# Tests connect directly to engine addresses. Docker Desktop's
# port forwarder drops FoundationDB's connection exchange on macOS.
#
# Mount the tree at its host path. A test uses its
# container path when it requests a file bind mount, and the
# daemon reads that path on its own host (testenv.SharedDir).

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        FDB_VERSION: ${FDB_VERSION:-7.4.6}
    # The grace period exceeds testenv's signal release limit of two minutes,
    # which gives `docker stop` time to let the test binary remove its engines.
    stop_grace_period: 150s
    volumes:
      # The source bind mount exposes host edits without rebuilding the image.
      - .:${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
      # The internal/testenv package starts test engines through this daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Go's build and module caches across
      # runs. Later runs compile only changed code.
      - tack-test-go-cache:/root/.cache/go-build
      - tack-test-go-mod:/go/pkg/mod
      # Store test temporary files on a disk filesystem. The kernel
      # cannot report the page cache through the container's
      # overlayfs, and the staging test measures the downloaded file's cache.
      - /tmp/tack-test
    environment:
      TMPDIR: /tmp/tack-test
      # "1" runs the OpenSearch-backed search tests. `make test-search` sets it.
      TACK_SEARCH_INTEGRATION: ${TACK_SEARCH_INTEGRATION:-}
      TACK_TEST_SOURCE_REVISION: ${TACK_TEST_SOURCE_REVISION:-}
      # "1" also runs the multi-member cluster tests, which need 24 GiB.
      TACK_SEARCH_CLUSTER: ${TACK_SEARCH_CLUSTER:-}
    working_dir: ${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
    profiles: ["runner"]

  # The PostgreSQL provider overlay tests run here. This image builds the
  # patched provider and installs OpenTofu, which the normal runner does not.
  # `make test-postgresql-overlay` runs it.
  # The tests run OpenTofu in this container through the Docker SDK.
  pgoverlay-tests:
    build:
      context: .
      dockerfile: Dockerfile.pgoverlay-test
    volumes:
      - .:${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
      - /var/run/docker.sock:/var/run/docker.sock
      - pgoverlay-go-cache:/root/.cache/go-build
      - pgoverlay-go-mod:/go/pkg/mod
      - /tmp/tack-test
    environment:
      TMPDIR: /tmp/tack-test
      # The engines of the run join the project network below, which Compose
      # creates for this project and removes with `down`.
      TACK_PG_OVERLAY_NETWORK: ${COMPOSE_PROJECT_NAME:?run this service through make test-postgresql-overlay}_pgoverlay
      TACK_PG_OVERLAY_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks:
      - pgoverlay
    working_dir: ${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
    profiles: ["pgoverlay-runner"]

networks:
  # Use IPv4 only, as the shared testenv network does. Engine images
  # require IPv4, which the daemon's default network options can omit.
  pgoverlay:
    enable_ipv4: true
    enable_ipv6: false

volumes:
  tack-test-go-cache:
  tack-test-go-mod:
  # Each overlay run uses a separate Compose project and shares these
  # persistent external caches. Compose does not assign project labels or
  # report project mismatches for them. The down command does not remove
  # them. The make test-postgresql-overlay command creates missing caches.
  pgoverlay-go-cache:
    name: tack-pgoverlay-go-cache
    external: true
  pgoverlay-go-mod:
    name: tack-pgoverlay-go-mod
    external: true
