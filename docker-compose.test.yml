# Local Go test runner.
#
# One service, tests, builds a Go image that links the same FoundationDB
# client library the production server links and runs go test against a
# bind-mount of the working tree. `make test-unit` and `make test-integration`
# run it.
#
# Tests that need a store start it themselves through internal/testenv, which
# drives the Docker daemon through the SDK over the mounted socket: it starts
# or reuses a single-node FoundationDB and a YugabyteDB on the tack-testenv
# network and attaches this container to that network, so the engines are
# reached at their network addresses rather than through Docker Desktop's port
# forwarder, which drops FoundationDB's connect-packet exchange on macOS.

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        FDB_VERSION: ${FDB_VERSION:-7.4.6}
    volumes:
      # Source bind-mount: edits on the host are visible without a rebuild.
      - .:/src
      # The daemon internal/testenv starts the test engines on.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Go's build and module caches across runs so the second invocation
      # only compiles what changed.
      - tack-test-go-cache:/root/.cache/go-build
      - tack-test-go-mod:/go/pkg/mod
    profiles: ["runner"]

volumes:
  tack-test-go-cache:
  tack-test-go-mod:
