# Local Go test runner.
#
# One service, tests, builds a Go image that links the same FoundationDB
# client library the production server links and runs go test against a
# bind-mount of the working tree. `make test-unit` and `make test-integration`
# run it, and set TACK_TEST_ROOT to the tree's host path.
#
# Tests that need a store start it themselves through internal/testenv, which
# drives the Docker daemon through the SDK over the mounted socket: each test
# binary starts its own single-node FoundationDB and YugabyteDB on the
# tack-testenv network and attaches this container to that network, so the engines are
# reached at their network addresses rather than through Docker Desktop's port
# forwarder, which drops FoundationDB's connect-packet exchange on macOS.
#
# The tree is mounted at its host path, not a fixed one, because a test that
# asks the daemon to bind-mount a file names it by this container's path, and
# the daemon reads that path on its own host (testenv.SharedDir).

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        FDB_VERSION: ${FDB_VERSION:-7.4.6}
    volumes:
      # Source bind-mount: edits on the host are visible without a rebuild.
      - .:${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
      # The daemon internal/testenv starts the test engines on.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Go's build and module caches across runs so the second invocation
      # only compiles what changed.
      - tack-test-go-cache:/root/.cache/go-build
      - tack-test-go-mod:/go/pkg/mod
      # Test temporary files on a disk filesystem rather than the container's
      # overlayfs, through which the kernel reports no page cache: the staging
      # test reads the cache of the file it downloads.
      - /tmp/tack-test
    environment:
      TMPDIR: /tmp/tack-test
    working_dir: ${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
    profiles: ["runner"]

volumes:
  tack-test-go-cache:
  tack-test-go-mod:
