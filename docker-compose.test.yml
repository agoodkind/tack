# The tests service builds a Go runner image with the production FoundationDB
# client library version. `make test-unit` and `make test-integration` run
# go test against the bind-mounted tree and set TACK_TEST_ROOT to its host path.
#
# internal/testenv starts stores with the Docker SDK over the mounted socket.
# Each test binary starts single-node FoundationDB and YugabyteDB engines on
# tack-testenv and attaches this container to that network. Tests connect to
# engine network addresses directly. Docker Desktop's port forwarder drops
# FoundationDB's connect-packet exchange on macOS.
#
# Bind-mount the tree at its host path. Tests pass container paths to the
# daemon for bind mounts, and the daemon reads those paths on its host
# (testenv.SharedDir).

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        FDB_VERSION: ${FDB_VERSION:-7.4.6}
    # The grace period exceeds testenv's two-minute signal release limit.
    # `docker stop` allows the test binary to remove its engines before exit.
    stop_grace_period: 150s
    volumes:
      # The source bind mount exposes host edits without rebuilding the image.
      - .:${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
      # internal/testenv starts test engines on this Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuse Go build and module caches between runs to compile changed inputs.
      - tack-test-go-cache:/root/.cache/go-build
      - tack-test-go-mod:/go/pkg/mod
      # Use a disk filesystem for temporary files. overlayfs does not report
      # the page cache that the staging test inspects for its downloaded file.
      - /tmp/tack-test
    environment:
      TMPDIR: /tmp/tack-test
      # "1" runs the OpenSearch-backed search tests. `make test-search` sets it.
      TACK_SEARCH_INTEGRATION: ${TACK_SEARCH_INTEGRATION:-}
      TACK_TEST_SOURCE_REVISION: ${TACK_TEST_SOURCE_REVISION:-}
      # "1" also runs the multi-member cluster tests, which need 24 GiB.
      TACK_SEARCH_CLUSTER: ${TACK_SEARCH_CLUSTER:-}
    working_dir: ${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
    profiles: ["runner"]

  # `make test-postgresql-overlay` runs the PostgreSQL provider overlay tests.
  # This image builds the patched provider and installs OpenTofu, unlike the
  # normal runner. Tests run OpenTofu in this container through the Docker SDK.
  pgoverlay-tests:
    build:
      context: .
      dockerfile: Dockerfile.pgoverlay-test
    volumes:
      - .:${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
      - /var/run/docker.sock:/var/run/docker.sock
      - pgoverlay-go-cache:/root/.cache/go-build
      - pgoverlay-go-mod:/go/pkg/mod
      - /tmp/tack-test
    environment:
      TMPDIR: /tmp/tack-test
      # Test engines join this project network. Compose creates it for the
      # project and removes it with `down`.
      TACK_PG_OVERLAY_NETWORK: ${COMPOSE_PROJECT_NAME:?run this service through make test-postgresql-overlay}_pgoverlay
      TACK_PG_OVERLAY_PROJECT: ${COMPOSE_PROJECT_NAME}
    networks:
      - pgoverlay
    working_dir: ${TACK_TEST_ROOT:?set TACK_TEST_ROOT to the repository's host path}
    profiles: ["pgoverlay-runner"]

networks:
  # Engine images require IPv4. Default daemon network options can omit it.
  # Use IPv4 only, as the shared testenv network does.
  pgoverlay:
    enable_ipv4: true
    enable_ipv6: false

volumes:
  tack-test-go-cache:
  tack-test-go-mod:
  # Each overlay test uses a separate Compose project. External caches persist
  # between runs without project labels or project mismatch warnings.
  # `down` does not remove them. `make test-postgresql-overlay` creates them
  # when missing.
  pgoverlay-go-cache:
    name: tack-pgoverlay-go-cache
    external: true
  pgoverlay-go-mod:
    name: tack-pgoverlay-go-mod
    external: true
