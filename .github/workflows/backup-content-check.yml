name: backup-content-check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backup-content-check.sh'
      - 'scripts/backup-restore-test.sh'
      - '.github/workflows/backup-content-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backup-content-check.sh'
      - 'scripts/backup-restore-test.sh'
      - '.github/workflows/backup-content-check.yml'

permissions:
  contents: read

jobs:
  # Static checks plus negative-test gates. Real restore-tests run on the
  # deployment host (CT 117) via the systemd timer; CI cannot easily spin
  # up FoundationDB and a scratch volume per run, so we exercise the
  # cheaper structural checks here. The negative tests prove the
  # verification scripts actually fail on bad inputs; this is the gate
  # that would have caught the 2026-04-25 empty-backup defect.
  verify:
    name: shellcheck and negative-test the backup verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck scripts/backup-content-check.sh
          shellcheck scripts/backup-restore-test.sh

      - name: bash syntax
        run: |
          bash -n scripts/backup-content-check.sh
          bash -n scripts/backup-restore-test.sh

      - name: negative test 1 - empty FDB tarball must fail
        run: |
          set -euo pipefail
          neg=$(mktemp -d)
          mkdir -p "$neg/empty/lib" "$neg/empty/data"
          tar -C "$neg/empty" -czf "$neg/tack_fdb-data.tar.gz" .
          rm -rf "$neg/empty"
          if scripts/backup-content-check.sh "$neg"; then
            echo "FAIL: content-check accepted an empty FDB tarball" >&2
            exit 1
          fi
          rm -rf "$neg"
          echo "OK: empty FDB tarball rejected"

      - name: negative test 2 - truncated tarball must fail
        run: |
          set -euo pipefail
          neg=$(mktemp -d)
          # Build a real fdbbackup-shaped tar then truncate it.
          mkdir -p "$neg/src/snapshots" "$neg/src/logs/0000/0011" "$neg/src/kvranges/snapshot.000001168758944639/0" "$neg/src/properties"
          touch "$neg/src/snapshots/snapshot,1,2,3" "$neg/src/logs/0000/0011/log,1,2,a,b" "$neg/src/kvranges/snapshot.000001168758944639/0/range,1,a,b" "$neg/src/properties/log_begin_version"
          tar -C "$neg" -czf "$neg/fdb-snapshot-good.tar.gz" src
          head -c 8192 "$neg/fdb-snapshot-good.tar.gz" > "$neg/fdb-snapshot-bad.tar.gz"
          rm "$neg/fdb-snapshot-good.tar.gz"
          rm -rf "$neg/src"
          if scripts/backup-content-check.sh "$neg"; then
            echo "FAIL: content-check accepted a truncated tarball" >&2
            exit 1
          fi
          echo "OK: truncated tarball rejected"

      - name: negative test 3 - empty pg_dump must fail
        run: |
          set -euo pipefail
          neg=$(mktemp -d)
          : > "$neg/yugabyte.sql"
          echo "no DDL here" > "$neg/temporal-db.sql"
          if scripts/backup-content-check.sh "$neg"; then
            echo "FAIL: content-check accepted empty/malformed pg_dump files" >&2
            exit 1
          fi
          echo "OK: empty and malformed pg_dump rejected"
