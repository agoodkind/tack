name: Provider release

# The image workflow publishes both container images before starting the provider release.
# Keep this filename because shared Go CI treats release.yml as a root module release.
on:
  workflow_call:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: terraform-provider-tack
      working_directory: provider
    secrets: inherit

  images:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: add container image references
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          TACK_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/tack-server
          TACK_AUDIT_CONSUMER_IMAGE: ghcr.io/${{ github.repository_owner }}/tack-audit-consumer
        run: bash scripts/release-images.sh
