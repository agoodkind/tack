name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when the same PR pushes a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: write

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      golangci_lint_version: v2.13.2
      pre_make_commands: |
        fdb_version=7.4.6
        curl -fsSL \
          "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
          -o /tmp/fdb-clients.deb
        sudo dpkg -i /tmp/fdb-clients.deb
        rm /tmp/fdb-clients.deb
      timeout_minutes: 15

  integration:
    name: integration tests (FDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start FoundationDB and the ledger themselves through
      # internal/testenv and reach them at their bridge addresses from the
      # host. The package list matches TEST_STORE_PACKAGES in the Makefile.
      - name: run the store-backed tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -count=1 -timeout 30m -v \
            ./internal/test/integration/... ./internal/adapters/foundationdb/... \
            ./internal/audit/... ./internal/ops/... ./internal/datagen/... ./cmd/server/...
