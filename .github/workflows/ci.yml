name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when the same PR pushes a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: write

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      golangci_lint_version: v2.11.4
      job_layout: single
      runs_on: tack
      pre_make_commands: |
        fdb_version=7.4.6
        curl -fsSL \
          "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
          -o /tmp/fdb-clients.deb
        sudo dpkg -i /tmp/fdb-clients.deb
        rm /tmp/fdb-clients.deb
      timeout_minutes: 15

  integration:
    name: integration tests (FDB)
    runs-on: [self-hosted, Linux, X64, tack]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: tack-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: run integration tests
        run: ./scripts/test-integration-ci.sh
