name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  server:
    name: Server
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    secrets: inherit
    with:
      timeout_minutes: 10
      pre_make_commands: make ci-fdb-client

  provider:
    name: Tack provider
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    secrets: inherit
    with:
      working_directory: provider
      go_version_file: provider/go.mod
      timeout_minutes: 10
