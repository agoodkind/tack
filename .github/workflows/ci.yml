name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when the same PR pushes a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: write

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      golangci_lint_version: v2.13.2
      pre_make_commands: |
        fdb_version=7.4.6
        curl -fsSL \
          "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
          -o /tmp/fdb-clients.deb
        sudo dpkg -i /tmp/fdb-clients.deb
        rm /tmp/fdb-clients.deb
      timeout_minutes: 15

  integration:
    name: integration tests (FDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start FoundationDB and the ledger themselves through
      # internal/testenv and reach them at their bridge addresses from the
      # host.
      - name: run the store-backed tests
        run: make test-store-host

  # Each job runs one final-validation search group; the job limit is the
  # group's go test limit plus 15 minutes of setup. The cluster group G4 runs
  # only on the Mac runner.
  search:
    name: search integration tests (OpenSearch ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: G1
            timeout_minutes: 75
          - group: G2
            timeout_minutes: 45
          - group: G3
            timeout_minutes: 45
          - group: G5
            timeout_minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start OpenSearch, FoundationDB, and the ledger through
      # internal/testenv and dial them at their bridge addresses from the host.
      - name: run the OpenSearch-backed tests
        run: make test-search-host-group GROUP=${{ matrix.group }}
