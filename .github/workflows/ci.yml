name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new pull request commit cancels the previous commit's run. Each main push
# uses its own commit as the concurrency group key and does not cancel other runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  attestations: write

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      job_layout: single
      golangci_lint_version: v2.15.0
      pre_make_commands: |
        fdb_version=7.4.6
        curl -fsSL \
          "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
          -o /tmp/fdb-clients.deb
        sudo dpkg -i /tmp/fdb-clients.deb
        rm /tmp/fdb-clients.deb
      # The table compares recorded Test runs with configured limits:
      # | Timing | Duration | Purpose |
      # | --- | --- | --- |
      # | Recorded Test job | 13 to 15 minutes | Historical job duration. |
      # | Recorded last package start | About 5 minutes after job start | Historical start time. |
      # | GO_TEST_TARGETS | 20 minutes per package | Limit each package's go test run. |
      # | Job timeout | 30 minutes | Allow hung tests to print timeout reports before the job ends. |
      timeout_minutes: 30

  # The provider job runs the shared go-makefile _ci.yml workflow with
  # working_directory: provider. The root job's ./... excludes this nested Go module.
  provider:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      golangci_lint_version: v2.15.0
      working_directory: provider
      go_version_file: provider/go.mod

  # The overlay job builds an image that fetches the pinned PostgreSQL provider
  # source, applies the patch, builds the provider through go-makefile, and
  # installs the pinned OpenTofu after a SHA-256 check. The tests run OpenTofu
  # in containers from that image against local PostgreSQL and YugabyteDB
  # engines that internal/testenv starts.
  postgresql-overlay:
    name: postgresql provider overlay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: build the provider and run the overlay tests
        run: make test-postgresql-overlay

  # The store-backed tests run in three shards on separate hosts. Each shard
  # runs one test-store-host-shard selection in the Makefile.
  integration-shard:
    name: ${{ matrix.description }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: integration-a-through-l
            description: integration tests (FoundationDB, names A through L)
          - shard: remaining-integration-tests
            description: integration tests (FoundationDB, remaining names)
          - shard: other-store-packages
            description: integration tests (FoundationDB, other store packages)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start FoundationDB and the ledger
      # through internal/testenv. The host connects to
      # both engines at their bridge network addresses.
      - name: run the store-backed tests
        run: make test-store-host-shard SHARD=${{ matrix.shard }}

  # The ruleset requires the check name integration tests (FDB). This job
  # passes only when every store-backed shard passes.
  integration:
    name: integration tests (FDB)
    needs: integration-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every store-backed shard to pass
        run: test "${{ needs.integration-shard.result }}" = success

  # Run the long runtime audit suites separately from shared Test and store-backed jobs.
  # - Allow 40 minutes for go test.
  # - Allow 10 minutes for setup.
  runtime-audit:
    name: runtime audit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      - name: run the runtime audit coverage tests
        run: make test-runtime-audit-host

  # Feature partitions select tests by name outside the dedicated groups.
  # The table lists each job's test, SDK contract, and setup allocations:
  # | Group | go test | SDK contract | Setup |
  # | --- | --- | --- | --- |
  # | Continuation | 60 minutes | Not applicable | 15 minutes |
  # | Rebuild, split, and restore | 45 minutes | Not applicable | 15 minutes |
  # | Features A through M | 75 minutes | 20 minutes | 15 minutes |
  # | Other feature jobs | 75 minutes | Not applicable | 15 minutes |
  # Only the Mac runner runs throughput and cluster failure tests.
  search:
    name: ${{ matrix.description }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: continuation-with-duplicate-pages
            description: Search continuation with duplicate pages
            timeout_minutes: 75
          - group: rebuild-split-and-restore
            description: Search rebuild, split, and restore
            timeout_minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start OpenSearch, FoundationDB, and the ledger through
      # internal/testenv and dial them at their bridge addresses from the host.
      - name: run the OpenSearch-backed tests
        run: make test-search-host-group GROUP=${{ matrix.group }}

  search-features:
    name: ${{ matrix.description }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: features-a-through-m
            description: Search permissions, pagination, and concurrent updates
            timeout_minutes: 110
          - group: remaining-features
            description: Search queries, indexing, relationships, and session cleanup
            timeout_minutes: 90
          - group: runtime-and-session-audit
            description: Search runtime and session audit recording
            timeout_minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install the FoundationDB client library
        run: |
          fdb_version=7.4.6
          curl -fsSL \
            "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
            -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
          rm /tmp/fdb-clients.deb

      # The tests start OpenSearch, FoundationDB, and the ledger through
      # internal/testenv and dial them at their bridge addresses from the host.
      - name: verify the OpenSearch SDK public adapter contract
        if: matrix.group == 'features-a-through-m'
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
          TACK_SEARCH_CLUSTER: '1'
        run: >-
          make test-search-host
          TEST_SEARCH_ARGS='-race -p=2 -count=1 -timeout 20m -v -run ^TestSearchSDKCompatibility$$ ./internal/test/integration/...'

      - name: run the OpenSearch-backed tests
        run: make test-search-host-group GROUP=${{ matrix.group }}

  # This aggregate passes only when every search feature partition passes.
  search-features-required:
    name: search integration tests (OpenSearch features)
    needs: search-features
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every search feature partition to pass
        run: test "${{ needs.search-features.result }}" = success
