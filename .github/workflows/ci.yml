name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: foundationdb-rs/foundationdb-actions-install@main
        with:
          version: "7.4.6"

      - uses: agoodkind/go-makefile/.github/actions/ci@main

  provider:
    name: Tofu Provider
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    secrets: inherit
    with:
      working_directory: provider
      go_version_file: provider/go.mod
      timeout_minutes: 10
