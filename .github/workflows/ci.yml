name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_go.yml
    with:
      task: checks

  build:
    name: Build
    uses: ./.github/workflows/_go.yml
    with:
      task: build

  database:
    name: Tests
    uses: ./.github/workflows/_database.yml

  database-required:
    name: Tests / Database
    needs: database
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every database partition to pass
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "${DATABASE_RESULT}" = success

  audit:
    name: Tests / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          foundationdb: 'true'
      - name: Run runtime audit coverage
        run: make test-runtime-audit-host

  search:
    name: Tests
    uses: ./.github/workflows/_search.yml

  search-required:
    name: Tests / Search
    needs: search
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every search regression partition to pass
        env:
          SEARCH_RESULT: ${{ needs.search.result }}
        run: test "${SEARCH_RESULT}" = success

  postgresql-provider:
    name: Tests / PostgreSQL provider
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build the patched provider and run OpenTofu tests
        run: make test-postgresql-overlay
