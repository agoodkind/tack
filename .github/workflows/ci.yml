name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when the same PR pushes a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: write

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      golangci_lint_version: v2.11.4
      pre_make_commands: |
        fdb_version=7.4.6
        curl -fsSL \
          "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" \
          -o /tmp/fdb-clients.deb
        sudo dpkg -i /tmp/fdb-clients.deb
        rm /tmp/fdb-clients.deb
      timeout_minutes: 15

  integration:
    name: integration tests (FDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: tack-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      # One password for the whole job: the database volume is created with
      # it by the first script and every later script must present the same.
      - name: set the test database password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "TEST_YB_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: bring up FDB
        run: ./scripts/test-fdb-up.sh

      - name: run integration tests
        run: ./scripts/test-integration.sh

      # The chain-append, outbox, dead-letter, and token tests skip without a
      # migrated ledger DSN, so without this step nothing in CI ran them.
      - name: run database-gated audit tests
        run: ./scripts/test-audit-db.sh

      - name: tear down
        if: always()
        run: ./scripts/test-fdb-down.sh
