name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_go.yml
    with:
      task: checks

  build:
    name: Build
    uses: ./.github/workflows/_go.yml
    with:
      task: build
