name: Search

on:
  workflow_call:
    inputs:
      full_acceptance:
        description: Run the large search pagination acceptance case.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: features-a-through-m
            name: Search features (1 of 2)
            timeout_minutes: 110
          - group: remaining-features
            name: Search features (2 of 2)
            timeout_minutes: 90
          - group: runtime-and-session-audit
            name: Search audit
            timeout_minutes: 90
          - group: rebuild-split-and-restore
            name: Search recovery
            timeout_minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-go
        with:
          foundationdb: 'true'

      - name: Verify the OpenSearch SDK public adapter contract
        if: matrix.group == 'features-a-through-m'
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
          TACK_SEARCH_CLUSTER: '1'
        run: >-
          make test-search-host
          TEST_SEARCH_ARGS='-race -p=2 -count=1 -timeout 20m -v -run ^TestSearchSDKCompatibility$$ ./internal/test/integration/...'

      - name: Run the search regression group
        run: make test-search-host-group GROUP=${{ matrix.group }}

  large-pagination:
    name: Large search pagination
    if: inputs.full_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-go
        with:
          foundationdb: 'true'

      - name: Run large search pagination acceptance
        run: make test-search-host-group GROUP=continuation-with-duplicate-pages
