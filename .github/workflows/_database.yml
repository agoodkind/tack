name: Database regression tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  database:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: integration-a-through-l
            name: Database (1 of 2)
          - shard: remaining-integration-tests
            name: Database (2 of 2)
          - shard: other-store-packages
            name: Database maintenance
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          foundationdb: 'true'
      - name: Run database tests
        run: make test-store-host-shard SHARD=${{ matrix.shard }}
