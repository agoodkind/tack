name: Images and releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Overlay drift blocks every native image build.
  overlay-drift:
    name: Checks / Database patches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: check overlay drift
        run: bash scripts/check-overlay-drift.sh

  build-native:
    name: Images / Build ${{ matrix.component }} (${{ matrix.arch }})
    needs: overlay-drift
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [tack-server, tack-audit-consumer]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: tack-server
            component: Server
            dockerfile: Dockerfile
            extra_build_args: "FDB_VERSION=7.4.6"
          - image: tack-audit-consumer
            component: Audit consumer
            dockerfile: Dockerfile.audit-consumer
            extra_build_args: ""
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: verify native runner
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: go run ./cmd/ci/image verify-native-runner

      - name: derive build metadata
        id: meta
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: go run ./cmd/ci/image metadata

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: build native image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ${{ matrix.extra_build_args }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            TAG=${{ steps.meta.outputs.tag }}
            DIRTY=false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: export immutable digest
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: go run ./cmd/ci/image digest

      - name: upload immutable digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  # Publish the candidate tags and indexes that QA deployment consumes.
  build:
    name: Images / Publish ${{ matrix.component }}
    needs: [overlay-drift, build-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tack-server
            component: Server
            dockerfile: Dockerfile
            extra_build_args: "FDB_VERSION=7.4.6"
          - image: tack-audit-consumer
            component: Audit consumer
            dockerfile: Dockerfile.audit-consumer
            extra_build_args: ""
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: derive build metadata
        id: meta
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: go run ./cmd/ci/image metadata

      - name: docker tags
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          COMMIT_SHORT: ${{ steps.meta.outputs.short }}
          IMAGE_TAG_FILE: ${{ runner.temp }}/image-tags
        run: go run ./cmd/ci/image tags

      - name: download immutable digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: publish native platform manifests
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG_FILE: ${{ runner.temp }}/image-tags
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: bash scripts/image-manifest.sh

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    secrets: inherit
