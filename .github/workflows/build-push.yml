name: build and push tack images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Block the build when a vendored container overlay has drifted from the file
  # it replaces in its pinned upstream image. The image build depends on this, so
  # drift fails the whole run and no image ships. See scripts/check-overlay-drift.sh
  # and TACK-302.
  overlay-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: check overlay drift
        run: bash scripts/check-overlay-drift.sh

  build:
    needs: overlay-drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tack-server
            dockerfile: Dockerfile
            extra_build_args: "FDB_VERSION=7.4.6"
          - image: tack-audit-consumer
            dockerfile: Dockerfile.audit-consumer
            extra_build_args: ""
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: derive build metadata
        id: meta
        run: |
          set -eu
          commit_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short HEAD)
          build_time=$(date -u +%FT%TZ)
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
              tag=$(git describe --tags --exact-match HEAD)
          else
              tag=$(git rev-parse --abbrev-ref HEAD)
          fi
          {
              echo "commit=${commit_sha}"
              echo "short=${short_sha}"
              echo "build_time=${build_time}"
              echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: docker tags
        id: tags
        run: |
          set -eu
          base="${REGISTRY}/${{ github.repository_owner }}/${{ matrix.image }}"
          short=${{ steps.meta.outputs.short }}
          ref_kind=${GITHUB_REF_TYPE}
          tags="${base}:${short}"$'\n'"${base}:${{ github.sha }}"
          if [ "${ref_kind}" = "tag" ]; then
              release="${GITHUB_REF_NAME}"
              tags="${tags}"$'\n'"${base}:${release}"
              tags="${tags}"$'\n'"${base}:latest"
          else
              branch_tag=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')
              tags="${tags}"$'\n'"${base}:${branch_tag}"
              if [ "${GITHUB_REF_NAME}" = "main" ]; then
                  tags="${tags}"$'\n'"${base}:latest"
              fi
          fi
          {
              echo "list<<__EOF__"
              echo "${tags}"
              echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: login to ghcr
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            ${{ matrix.extra_build_args }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            TAG=${{ steps.meta.outputs.tag }}
            DIRTY=false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
