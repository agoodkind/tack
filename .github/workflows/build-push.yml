name: build and push tack-server

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tack-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: derive build metadata
        id: meta
        run: |
          set -eu
          commit_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short HEAD)
          build_time=$(date -u +%FT%TZ)
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
              tag=$(git describe --tags --exact-match HEAD)
          else
              tag=$(git rev-parse --abbrev-ref HEAD)
          fi
          {
              echo "commit=${commit_sha}"
              echo "short=${short_sha}"
              echo "build_time=${build_time}"
              echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: docker tags
        id: tags
        run: |
          set -eu
          base="${REGISTRY}/${IMAGE_NAME}"
          short=${{ steps.meta.outputs.short }}
          ref_kind=${GITHUB_REF_TYPE}
          tags="${base}:${short}"$'\n'"${base}:${{ github.sha }}"
          if [ "${ref_kind}" = "tag" ]; then
              release="${GITHUB_REF_NAME}"
              tags="${tags}"$'\n'"${base}:${release}"
              tags="${tags}"$'\n'"${base}:latest"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
              tags="${tags}"$'\n'"${base}:latest"
          fi
          {
              echo "list<<__EOF__"
              echo "${tags}"
              echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            FDB_VERSION=7.4.6
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            TAG=${{ steps.meta.outputs.tag }}
            DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
