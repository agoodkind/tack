name: Send Tack release evidence to Configs

on:
  workflow_run:
    workflows: [Images and releases]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'agoodkind/tack' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: tack-release-publisher
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download the successful build attempt's release artifact
        id: release-archive
        env:
          GH_TOKEN: ${{ github.token }}
          TACK_BUILD_RUN: ${{ github.event.workflow_run.id }}
          TACK_BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/tack-release.zip
        run: bash scripts/download-release-artifact.sh
      - name: Create Configs dispatch token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: configs-dispatch
        with:
          client-id: ${{ vars.TACK_RELEASE_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TACK_RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: agoodkind
          repositories: configs
          permission-contents: write
      - name: Send verified release evidence to Configs
        env:
          GH_TOKEN: ${{ steps.configs-dispatch.outputs.token }}
          TACK_BUILD_RUN: ${{ github.event.workflow_run.id }}
          TACK_BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TACK_ARTIFACT_ID: ${{ steps.release-archive.outputs.artifact-id }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/tack-release.zip
        run: bash scripts/dispatch-release.sh
