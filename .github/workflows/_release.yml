name: Publish releases

on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  provider:
    name: Providers
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: terraform-provider-tack
      working_directory: provider
    secrets: inherit

  image-references:
    name: Image references
    needs: provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, packages: read}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: add container image references
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.provider.outputs.tag }}
          TACK_SERVER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tack-server
          TACK_AUDIT_CONSUMER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tack-audit-consumer
        run: bash scripts/release-images.sh
