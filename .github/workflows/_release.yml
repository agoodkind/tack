name: Publish releases

on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  provider:
    name: Providers
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: terraform-provider-tack
      working_directory: provider
    secrets: inherit

  image-references:
    name: Image references
    needs: provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, packages: read}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Download the published image indexes
        uses: actions/download-artifact@v8
        with:
          pattern: release-index-*
          path: ${{ runner.temp }}/release-indexes
          merge-multiple: true
      - name: add container image references
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INDEX_DIRECTORY: ${{ runner.temp }}/release-indexes
          RELEASE_MANIFEST: ${{ runner.temp }}/release.json
          RELEASE_TAG: ${{ needs.provider.outputs.tag }}
          TACK_SERVER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tack-server
          TACK_AUDIT_CONSUMER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tack-audit-consumer
        run: bash scripts/release-images.sh
      - name: Upload successful release evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tack-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
